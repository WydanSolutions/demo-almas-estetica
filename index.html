<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<title>ALMAS · Gestión Clínica</title>
<meta name="description" content="Herramienta de gestión a medida para ALMAS Clínica de Estética Médica. Desarrollado por Wydan Solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   ALMAS · SISTEMA DE GESTIÓN  —  Wydan Solutions
   Hoja de estilos única. Todos los colores y medidas salen de las
   variables de abajo: cambiando estas líneas cambia toda la app.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* Marca */
  --oro:#B8955B; --oro-claro:#D4B57E; --oro-oscuro:#9C7A44;
  --oro-grad:linear-gradient(135deg,#D4B57E 0%,#B8955B 48%,#9C7A44 100%);
  --marron:#3B3129; --marron-2:#6B5E50; --marron-3:#9A8C7C;
  --crema:#F4EFE6; --crema-2:#FAF7F1; --blanco:#FFFFFF;
  --borde:#E7DFD2; --borde-fuerte:#D8CCB9;
  /* Estados */
  --salvia:#7BA68A; --salvia-bg:#EDF4EF;
  --ambar:#D1A054;  --ambar-bg:#FBF2E2;
  --terra:#C4694F;  --terra-bg:#F9EBE6;
  --info:#6E8CA8;   --info-bg:#EDF2F6;
  /* Forma */
  --r:14px; --r-sm:10px; --r-lg:18px;
  --sombra:0 1px 2px rgba(59,49,41,.04),0 6px 20px -8px rgba(59,49,41,.10);
  --sombra-alta:0 2px 6px rgba(59,49,41,.06),0 24px 48px -18px rgba(59,49,41,.22);
  --ff-tit:'Cinzel','Marcellus',Georgia,serif;
  --ff-txt:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-w:252px; --head-h:62px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff-txt); font-size:14px; line-height:1.55;
  color:var(--marron); background:var(--crema);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:500;letter-spacing:.01em}
p{margin:0 0 .6em}
a{color:inherit}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:#E8D9BE;color:var(--marron)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#DED3C1;border-radius:9px;border:2px solid var(--crema)}
*::-webkit-scrollbar-thumb:hover{background:var(--oro-claro)}

/* ── Tipografía de marca ─────────────────────────────────────────── */
.tit{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.18em;font-weight:500}
.tit-xl{font-size:clamp(19px,2.4vw,25px);letter-spacing:.14em}
.tit-l{font-size:16px;letter-spacing:.16em}
.tit-m{font-size:13px;letter-spacing:.18em}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--marron-3);font-weight:600}
.muted{color:var(--marron-2)}
.muted-2{color:var(--marron-3)}
.mono{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.center{text-align:center}.right{text-align:right}
.hr{height:1px;background:var(--borde);border:0;margin:16px 0}
.hr-star{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--oro)}
.hr-star::before,.hr-star::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--borde-fuerte),transparent)}

/* ── Layout general ──────────────────────────────────────────────── */
#app{display:none;min-height:100vh}
#app.on{display:block}
.shell{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--blanco);
  border-right:1px solid var(--borde);display:flex;flex-direction:column;
  position:fixed;inset:0 auto 0 0;z-index:60;transition:transform .28s ease;
}
.nav__logo{padding:20px 20px 14px;border-bottom:1px solid var(--borde)}
.nav__logo svg{display:block;width:100%;height:auto;max-height:86px}
.nav__menu{flex:1;overflow-y:auto;padding:12px 10px}
.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin-bottom:2px;
  background:none;border:0;border-radius:var(--r-sm);cursor:pointer;text-align:left;
  font-size:13.5px;font-weight:500;color:var(--marron-2);transition:background .16s,color .16s;
}
.navbtn:hover{background:var(--crema-2);color:var(--marron)}
.navbtn.on{background:linear-gradient(90deg,rgba(184,149,91,.14),rgba(184,149,91,.04));color:var(--marron);font-weight:600}
.navbtn.on .navbtn__ic{color:var(--oro-oscuro)}
.navbtn__ic{width:19px;height:19px;flex:0 0 19px;color:var(--marron-3);transition:color .16s}
.navbtn__pill{margin-left:auto;background:var(--terra);color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.nav__pie{padding:14px 18px;border-top:1px solid var(--borde);display:flex;align-items:center;gap:9px;color:var(--marron-3)}
.nav__pie svg{height:16px;width:auto;opacity:.85}
.nav__pie span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.main{flex:1;min-width:0;margin-left:var(--nav-w)}
.topbar{
  height:var(--head-h);position:sticky;top:0;z-index:40;background:rgba(250,247,241,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:12px;padding:0 18px;
}
.topbar__t{flex:1;min-width:0}
.topbar__t h1{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.16em;font-size:15px;line-height:1.2}
.topbar__t small{display:block;font-size:11px;color:var(--marron-3);margin-top:1px}
.burger{display:none;background:none;border:1px solid var(--borde);border-radius:9px;width:38px;height:38px;
  align-items:center;justify-content:center;cursor:pointer;color:var(--marron)}
.vista{padding:20px 18px 90px;max-width:1480px;margin:0 auto;animation:fadeUp .34s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scrim{display:none;position:fixed;inset:0;background:rgba(59,49,41,.42);z-index:55;backdrop-filter:blur(2px)}
.scrim.on{display:block}

/* ── Tarjetas ────────────────────────────────────────────────────── */
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra)}
.card__h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--borde);flex-wrap:wrap}
.card__h h3{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.15em;font-size:12.5px;color:var(--marron)}
.card__h .sp{flex:1}
.card__b{padding:16px}
.card__b.tight{padding:0}
/* minmax(0,1fr) y no 1fr: sin esto, una columna nunca encoge por debajo
   de su contenido y la página se desborda a lo ancho en pantallas chicas. */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,1.85fr) minmax(0,1.15fr)}
.g-1-2{grid-template-columns:minmax(0,1.15fr) minmax(0,1.85fr)}
/* Rejilla que decide sola cuántas columnas entran */
.gfit{grid-template-columns:repeat(auto-fit,minmax(min(var(--min,304px),100%),1fr))}
/* Fila de indicadores: los de la última línea se estiran, nunca quedan huecos */
.kpis{display:flex;flex-wrap:wrap;gap:14px}
.kpis>*{flex:1 1 184px;min-width:0}
/* A partir de tablet, ningún indicador suelto puede pasar de un tercio del ancho:
   así una fila incompleta sigue pareciendo una tarjeta y no un cartel. */
@media (min-width:861px){ .kpis>*{max-width:34%} }
/* Listas largas con scroll propio: la tarjeta no estira la página */
@media (min-width:861px){ .scrolly{max-height:var(--h,470px);overflow-y:auto;padding-right:6px;margin-right:-4px} }

.kpi{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--oro-grad);opacity:.85}
.kpi.ok::after{background:var(--salvia)}.kpi.warn::after{background:var(--ambar)}.kpi.bad::after{background:var(--terra)}
.kpi__l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--marron-3);font-weight:600;padding-right:26px;line-height:1.4}
.kpi__v{font-size:clamp(19px,2.2vw,24px);font-weight:600;margin-top:5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi__s{font-size:11.5px;color:var(--marron-2);margin-top:3px}
.kpi__ic{position:absolute;right:12px;top:12px;width:20px;height:20px;color:var(--oro);opacity:.45}

/* ── Badges / estados ───────────────────────────────────────────── */
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  padding:3.5px 9px;border-radius:99px;white-space:nowrap;line-height:1.3;border:1px solid transparent}
.bdg::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.bdg.ok{background:var(--salvia-bg);color:#4E7A60;border-color:#D3E4D9}
.bdg.warn{background:var(--ambar-bg);color:#9A6F28;border-color:#EEDCBE}
.bdg.bad{background:var(--terra-bg);color:#A14E37;border-color:#EFD4CB}
.bdg.info{background:var(--info-bg);color:#4E6880;border-color:#D4E0E9}
.bdg.neutro{background:var(--crema);color:var(--marron-2);border-color:var(--borde)}
.bdg.oro{background:#F6EEDF;color:var(--oro-oscuro);border-color:#EADCC0}
.bdg--lg{font-size:11.5px;padding:5px 12px}
.bdg--plain::before{display:none}

/* ── Botones ─────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--borde-fuerte);
  background:var(--blanco);color:var(--marron);padding:8.5px 15px;border-radius:var(--r-sm);cursor:pointer;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;transition:all .16s;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--oro);color:var(--oro-oscuro);background:var(--crema-2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn svg{width:15px;height:15px;flex:0 0 15px}
.btn--p{background:var(--oro-grad);border-color:transparent;color:#fff;box-shadow:0 2px 10px -3px rgba(156,122,68,.6)}
.btn--p:hover{color:#fff;filter:brightness(1.07);box-shadow:0 5px 16px -4px rgba(156,122,68,.65)}
.btn--g{background:var(--salvia);border-color:transparent;color:#fff}
.btn--g:hover{color:#fff;filter:brightness(1.06)}
.btn--d{background:var(--terra);border-color:transparent;color:#fff}
.btn--d:hover{color:#fff;filter:brightness(1.06)}
.btn--wa{background:#25D366;border-color:transparent;color:#fff}
.btn--wa:hover{color:#fff;filter:brightness(1.05)}
.btn--sm{padding:5.5px 10px;font-size:11.5px;border-radius:8px}
.btn--sm svg{width:13px;height:13px;flex:0 0 13px}
.btn--ic{padding:7px;width:32px;height:32px}
.btn--gh{border-color:transparent;background:transparent}
.btn--gh:hover{background:var(--crema)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borde);overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--marron-3);white-space:nowrap;transition:.16s;letter-spacing:.03em}
.tab:hover{color:var(--marron)}
.tab.on{color:var(--oro-oscuro);border-bottom-color:var(--oro)}
.segm{display:inline-flex;background:var(--crema);border:1px solid var(--borde);border-radius:var(--r-sm);padding:3px;gap:2px}
.segm button{background:none;border:0;padding:6px 13px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--marron-2);transition:.16s}
.segm button.on{background:var(--blanco);color:var(--marron);box-shadow:0 1px 3px rgba(59,49,41,.1)}

/* ── Formularios ─────────────────────────────────────────────────── */
.f{margin-bottom:12px;min-width:0}
.f>label,.f-l{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--marron-3);margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;background:var(--blanco);border:1px solid var(--borde-fuerte);
  border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px;transition:border-color .16s,box-shadow .16s;outline:none}
.inp:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(184,149,91,.14)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.5}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239A8C7C' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:15px;padding-right:32px}
.hint{font-size:11px;color:var(--marron-3);margin-top:4px;line-height:1.4}
.chk{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid var(--borde);border-radius:9px;
  cursor:pointer;font-size:12.5px;background:var(--blanco);transition:.14s;margin-bottom:5px}
.chk:hover{border-color:var(--oro-claro);background:var(--crema-2)}
.chk input{margin:2px 0 0;accent-color:var(--oro);flex:0 0 auto;width:15px;height:15px}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:6px}
.buscador{position:relative;flex:1;min-width:180px}
.buscador svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--marron-3)}
.buscador .inp{padding-left:33px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros .inp{width:auto;min-width:140px;padding:7.5px 11px;font-size:12.5px}
.filtros select.inp{padding-right:30px}

/* ── Tablas ──────────────────────────────────────────────────────── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:12.8px;min-width:560px}
table.t th{text-align:left;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--marron-3);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--borde);background:var(--crema-2);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #F1EBE1;vertical-align:middle}
table.t tbody tr{transition:background .13s}
table.t tbody tr:hover{background:#FCFAF6}
table.t tbody tr.clic{cursor:pointer}
table.t tfoot td{padding:11px 12px;font-weight:700;border-top:2px solid var(--borde);background:var(--crema-2);font-size:12.5px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t--compact td,.t--compact th{padding:7px 10px}
.vacio{padding:34px 18px;text-align:center;color:var(--marron-3);font-size:13px}
.vacio svg{width:34px;height:34px;opacity:.4;margin-bottom:8px;display:block;margin-inline:auto}

/* ── Modal ───────────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal__bg{position:absolute;inset:0;background:rgba(59,49,41,.46);backdrop-filter:blur(3px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal__box{position:relative;background:var(--crema-2);width:100%;max-width:760px;max-height:94vh;
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sombra-alta);display:flex;flex-direction:column;animation:slideUp .28s cubic-bezier(.2,.8,.3,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal__h{padding:16px 20px;border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:12px;background:var(--blanco);
  border-radius:var(--r-lg) var(--r-lg) 0 0;flex:0 0 auto}
.modal__h h3{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.15em;font-size:13px;flex:1}
.modal__b{padding:18px 20px;overflow-y:auto;flex:1}
.modal__f{padding:13px 20px;border-top:1px solid var(--borde);display:flex;gap:8px;justify-content:flex-end;
  background:var(--blanco);flex-wrap:wrap;flex:0 0 auto}
.modal--ancho .modal__box{max-width:1080px}
.modal--chico .modal__box{max-width:470px}

#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;
  align-items:center;pointer-events:none;width:calc(100% - 28px);max-width:420px}
.toast{background:var(--marron);color:#F6F1E8;padding:11px 17px;border-radius:99px;font-size:12.5px;font-weight:500;
  box-shadow:var(--sombra-alta);animation:toastIn .3s cubic-bezier(.2,.9,.3,1);display:flex;align-items:center;gap:9px;max-width:100%}
.toast svg{width:16px;height:16px;flex:0 0 16px}
.toast.ok{background:#4E7A60}.toast.bad{background:#A14E37}.toast.warn{background:#9A6F28}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ── Alertas clínicas ───────────────────────────────────────────── */
.alertas{background:var(--terra-bg);border:1px solid #EFD4CB;border-left:3px solid var(--terra);
  border-radius:var(--r);padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
.alertas--ok{background:var(--salvia-bg);border-color:#D3E4D9;border-left-color:var(--salvia)}
.alertas--warn{background:var(--ambar-bg);border-color:#EEDCBE;border-left-color:var(--ambar)}
.alertas--info{background:var(--info-bg);border-color:#D4E0E9;border-left-color:var(--info)}
.alertas__ic{width:19px;height:19px;flex:0 0 19px;color:var(--terra);margin-top:1px}
.alertas--ok .alertas__ic{color:var(--salvia)}.alertas--warn .alertas__ic{color:var(--ambar)}.alertas--info .alertas__ic{color:var(--info)}
.alertas__t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#A14E37;margin-bottom:5px}
.alertas--ok .alertas__t{color:#4E7A60}.alertas--warn .alertas__t{color:#9A6F28}.alertas--info .alertas__t{color:#4E6880}
.alertas__c{display:flex;gap:6px;flex-wrap:wrap}
.aviso{font-size:11px;color:var(--marron-3);font-style:italic}

/* ── Agenda ──────────────────────────────────────────────────────── */
.ag-dia{display:flex;flex-direction:column;gap:8px}
.ag-dia>*{flex:0 0 auto}   /* sin esto, dentro de un contenedor con scroll las filas se aplastan */
.turno{display:flex;flex-wrap:wrap;gap:8px 12px;background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);
  padding:11px 13px;align-items:center;transition:.16s;cursor:pointer;position:relative;overflow:hidden}
.turno:hover{border-color:var(--oro-claro);box-shadow:var(--sombra);transform:translateX(2px)}
.turno::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--borde-fuerte)}
.turno[data-e="Realizado"]::before{background:var(--salvia)}
.turno[data-e="Confirmado"]::before{background:var(--oro)}
.turno[data-e="Pendiente"]::before{background:var(--ambar)}
.turno[data-e="Cancelado"]::before,.turno[data-e="No asistió"]::before{background:var(--terra)}
.turno__h{flex:0 0 62px;text-align:center}
.turno__h b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.turno__h small{font-size:10px;color:var(--marron-3)}
.turno__c{flex:1 1 150px;min-width:0}
.turno__c b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turno__c span{font-size:12px;color:var(--marron-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turno__a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.turno--next{border-color:var(--oro);box-shadow:0 0 0 3px rgba(184,149,91,.12)}
.alertaic{color:var(--terra);width:17px;height:17px;flex:0 0 17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--borde);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden}
.cal__dow{background:var(--crema-2);padding:7px 4px;text-align:center;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;color:var(--marron-3)}
.cal__d{background:var(--blanco);min-height:92px;padding:5px 6px;cursor:pointer;transition:background .14s;position:relative}
.cal__d:hover{background:var(--crema-2)}
.cal__d.off{background:#FBF9F5;color:var(--marron-3)}
.cal__d.hoy{background:#FCF8F1;box-shadow:inset 0 0 0 2px var(--oro)}
.cal__n{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.cal__ev{font-size:9.5px;background:var(--crema);border-left:2px solid var(--oro);padding:2px 4px;border-radius:3px;
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.cal__ev.ok{border-left-color:var(--salvia);background:var(--salvia-bg)}
.cal__ev.warn{border-left-color:var(--ambar);background:var(--ambar-bg)}
.cal__ev.bad{border-left-color:var(--terra);background:var(--terra-bg)}
.cal__mas{font-size:9px;color:var(--marron-3);margin-top:2px;font-weight:600}
.sem{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px}
.sem__col{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden;min-height:150px}
.sem__h{padding:8px;text-align:center;border-bottom:1px solid var(--borde);background:var(--crema-2)}
.sem__h b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.sem__h small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--marron-3);font-weight:700}
.sem__h.hoy{background:#FCF8F1;box-shadow:inset 0 2px 0 var(--oro)}
.sem__b{padding:7px;display:flex;flex-direction:column;gap:5px}
.sem__ev{font-size:10.5px;padding:5px 6px;border-radius:7px;background:var(--crema);border-left:2px solid var(--oro);cursor:pointer;transition:.14s}
.sem__ev:hover{transform:translateX(2px)}
.sem__ev b{display:block;font-variant-numeric:tabular-nums;font-size:11px}
.sem__ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--marron-2)}
.sem__ev.ok{border-left-color:var(--salvia);background:var(--salvia-bg)}
.sem__ev.warn{border-left-color:var(--ambar);background:var(--ambar-bg)}
.sem__ev.bad{border-left-color:var(--terra);background:var(--terra-bg)}
.anio{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.mesmini{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);padding:10px;cursor:pointer;transition:.16s}
.mesmini:hover{border-color:var(--oro-claro);box-shadow:var(--sombra)}
.mesmini h4{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;text-align:center;margin-bottom:7px}
.mesmini__g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mesmini__d{aspect-ratio:1;display:grid;place-items:center;font-size:9px;border-radius:4px;font-variant-numeric:tabular-nums;color:var(--marron-3)}
.mesmini__d.has{background:#F6EEDF;color:var(--oro-oscuro);font-weight:700}
.mesmini__d.has2{background:#EADCC0;color:var(--oro-oscuro);font-weight:700}
.mesmini__d.has3{background:var(--oro);color:#fff;font-weight:700}
.mesmini__d.hoy{box-shadow:0 0 0 1.5px var(--oro)}
.mesmini__f{text-align:center;font-size:10px;color:var(--marron-3);margin-top:6px;font-weight:600}

.prog{height:7px;background:var(--crema);border-radius:99px;overflow:hidden;border:1px solid var(--borde)}
.prog>i{display:block;height:100%;background:var(--oro-grad);border-radius:99px;transition:width .5s ease}
.prog.ok>i{background:var(--salvia)}.prog.bad>i{background:var(--terra)}
.prog--fino{height:5px}
.pasos{display:flex;gap:3px;flex-wrap:wrap}
.paso{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;
  background:var(--crema);border:1px solid var(--borde);color:var(--marron-3)}
.paso.ok{background:var(--oro-grad);border-color:transparent;color:#fff}
.paso.next{border-color:var(--oro);color:var(--oro-oscuro);border-style:dashed}

/* ── Fichas / historia clínica ──────────────────────────────────── */
.ficha__top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--oro-grad);color:#fff;display:grid;place-items:center;
  font-family:var(--ff-tit);font-size:19px;letter-spacing:.06em;flex:0 0 58px;box-shadow:0 3px 12px -3px rgba(156,122,68,.5)}
.avatar--sm{width:34px;height:34px;flex:0 0 34px;font-size:12px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px 18px}
.dl__i dt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--marron-3);font-weight:700;margin-bottom:2px}
.dl__i dd{margin:0;font-size:13px;font-weight:500}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--borde)}
.tl{position:relative;padding:0 0 15px}
.tl::before{content:'';position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--blanco);border:2px solid var(--oro)}
.tl.ok::before{border-color:var(--salvia)}.tl.bad::before{border-color:var(--terra)}
.tl__f{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--marron-3);font-weight:700}
.tl__t{font-size:13px;font-weight:600;margin-top:1px}
.tl__d{font-size:12px;color:var(--marron-2);margin-top:2px;line-height:1.5}
.nota{background:var(--crema-2);border:1px solid var(--borde);border-radius:9px;padding:8px 10px;font-size:11.8px;
  color:var(--marron-2);margin-top:6px;line-height:1.5}
.param{display:inline-flex;gap:4px;font-size:10.5px;background:var(--crema);border:1px solid var(--borde);
  padding:2px 7px;border-radius:6px;margin:2px 3px 0 0;font-variant-numeric:tabular-nums}
.param b{font-weight:700;color:var(--marron-3)}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:11px;align-items:center;padding:10px 12px;background:var(--blanco);border:1px solid var(--borde);
  border-radius:var(--r);transition:.16s}
.item:hover{border-color:var(--oro-claro)}
.item.clic{cursor:pointer}
.item__c{flex:1;min-width:0}
.item__c b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item__c span{font-size:11.5px;color:var(--marron-2);display:block}
.sug{border-left:3px solid var(--salvia)}
.sug.no{border-left-color:var(--terra);background:#FEFBFA}
.sug.prec{border-left-color:var(--ambar)}

/* ── Gráficos ───────────────────────────────────────────────────── */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--marron-2);margin-top:8px;justify-content:center}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.barh{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px}
.barh__n{flex:0 0 140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barh__b{flex:1;height:16px;background:var(--crema);border-radius:5px;overflow:hidden;border:1px solid var(--borde)}
.barh__b>i{display:block;height:100%;background:var(--oro-grad);border-radius:4px}
.barh__v{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}
.delta{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:2px}
.delta.up{color:#4E7A60}.delta.down{color:#A14E37}.delta.flat{color:var(--marron-3)}

/* ── Pantalla de bloqueo ────────────────────────────────────────── */
#lock{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:var(--crema);overflow:hidden;padding:20px}
#lock.off{animation:lockOut .55s ease forwards;pointer-events:none}
@keyframes lockOut{to{opacity:0;transform:scale(1.03);visibility:hidden}}
.lock__luz{position:absolute;inset:-40%;background:
  radial-gradient(42% 42% at 28% 30%,rgba(212,181,126,.42),transparent 62%),
  radial-gradient(38% 38% at 74% 66%,rgba(184,149,91,.30),transparent 60%),
  radial-gradient(50% 50% at 50% 90%,rgba(156,122,68,.16),transparent 65%);
  animation:luz 22s ease-in-out infinite alternate;filter:blur(18px)}
@keyframes luz{0%{transform:translate(-4%,-3%) rotate(0deg) scale(1)}50%{transform:translate(5%,4%) rotate(8deg) scale(1.1)}100%{transform:translate(-3%,6%) rotate(-5deg) scale(1.05)}}
.lock__mono{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(112vh,112vw);opacity:.055;pointer-events:none}
.lock__mono svg{width:100%;height:auto}
.lock__card{position:relative;z-index:2;width:100%;max-width:392px;background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:34px 28px 26px;text-align:center;
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 2px 8px rgba(59,49,41,.05),0 32px 64px -28px rgba(59,49,41,.34)}
.lock__card.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.lock__logo{margin:0 auto 20px;max-width:230px}
.lock__logo svg{width:100%;height:auto}
.lock__saludo{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.2em;font-size:12.5px;color:var(--oro-oscuro)}
.lock__sub{font-size:12px;color:var(--marron-2);margin:6px 0 20px}
.lock__inp .inp{text-align:center;letter-spacing:.5em;font-size:17px;padding:13px 14px;background:rgba(255,255,255,.75);
  border-color:rgba(184,149,91,.4)}
.lock__inp .inp::placeholder{letter-spacing:.2em;font-size:13px;color:var(--marron-3)}
.lock__err{color:var(--terra);font-size:11.5px;font-weight:600;height:16px;margin-top:7px}
.lock__pie{margin-top:22px;padding-top:16px;border-top:1px solid rgba(184,149,91,.22);display:flex;
  align-items:center;justify-content:center;gap:8px;color:var(--marron-3)}
.lock__pie svg{height:15px;width:auto;opacity:.8}
.lock__pie span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.lock__tip{font-size:10.5px;color:var(--marron-3);margin-top:10px}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.ok{background:var(--salvia)}.dot.warn{background:var(--ambar)}.dot.bad{background:var(--terra)}
.asis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:430px;margin-inline:auto}
.asis__d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--borde);background:var(--blanco);transition:.14s;position:relative}
.asis__d:hover{transform:scale(1.06);z-index:2;box-shadow:var(--sombra)}
.asis__d small{font-size:8px;font-weight:700;letter-spacing:.04em;opacity:.9}
.asis__d.P{background:var(--salvia-bg);border-color:#D3E4D9;color:#4E7A60}
.asis__d.F{background:var(--terra-bg);border-color:#EFD4CB;color:#A14E37}
.asis__d.J{background:var(--ambar-bg);border-color:#EEDCBE;color:#9A6F28}
.asis__d.M{background:#F6EEDF;border-color:#EADCC0;color:var(--oro-oscuro)}
.asis__d.L{background:var(--info-bg);border-color:#D4E0E9;color:#4E6880}
.asis__d.H{background:var(--crema);border-color:var(--borde);color:var(--marron-3)}
.asis__d.off{opacity:.3;pointer-events:none}
.calc{background:var(--crema-2);border:1px dashed var(--borde-fuerte);border-radius:var(--r);padding:13px 15px;font-size:12.5px}
.calc__l{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dotted var(--borde)}
.calc__l:last-child{border:0}
.calc__l b{font-variant-numeric:tabular-nums}
.calc__tot{display:flex;justify-content:space-between;gap:12px;padding-top:9px;margin-top:5px;border-top:2px solid var(--borde);
  font-weight:700;font-size:14.5px}

/* ── Documento imprimible ───────────────────────────────────────── */
#printArea{display:none}
.doc{font-family:var(--ff-txt);color:#111;background:#fff}
.doc h1{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.18em;font-size:16px;margin:0}
.doc h2{font-family:var(--ff-tit);text-transform:uppercase;letter-spacing:.14em;font-size:12px;margin:16px 0 7px;
  border-bottom:1px solid #ccc;padding-bottom:4px}
.doc__head{display:flex;align-items:center;gap:16px;border-bottom:2px solid #B8955B;padding-bottom:12px;margin-bottom:14px}
.doc__logo{flex:0 0 190px;width:190px}
.doc__head svg{width:100%;height:auto;display:block}
.doc p,.doc li,.doc td,.doc th{font-size:11px;line-height:1.55}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc th{background:#f3efe7;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:5px 7px;border:1px solid #ddd}
.doc td{padding:5px 7px;border:1px solid #e5e5e5}
.doc__firmas{display:flex;gap:40px;margin-top:44px}
.doc__firma{flex:1;border-top:1px solid #333;padding-top:5px;font-size:10px;text-align:center}
.doc__pie{margin-top:26px;border-top:1px solid #ddd;padding-top:8px;font-size:8.5px;color:#777;display:flex;justify-content:space-between}

.flex{display:flex}.col{flex-direction:column}.wrap{flex-wrap:wrap}
.ac{align-items:center}.as{align-items:flex-start}.jb{justify-content:space-between}.je{justify-content:flex-end}
.g4-{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g14{gap:14px}
.sp{flex:1}
.mt0{margin-top:0}.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt20{margin-top:20px}
.mb0{margin-bottom:0}.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}.mb20{margin-bottom:20px}
.fs11{font-size:11px}.fs12{font-size:12px}.fs13{font-size:13px}.fs15{font-size:15px}.fs17{font-size:17px}
.b6{font-weight:600}.b7{font-weight:700}
.oro{color:var(--oro-oscuro)}.verde{color:#4E7A60}.rojo{color:#A14E37}.ambar{color:#9A6F28}
.pill-oro{background:#F6EEDF;border:1px solid #EADCC0;color:var(--oro-oscuro);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600}
.scrollx{overflow-x:auto}
.estrella{width:11px;height:11px;flex:0 0 11px;color:var(--oro)}


/* ── Lista de opciones con búsqueda ──────────────────────────────
   Reemplaza a los <select> y a <datalist>: en el celular el desplegable
   del navegador no se abre bien y el toque no selecciona. Esta la
   armamos nosotros, así se comporta igual en computadora y en celular.
   ─────────────────────────────────────────────────────────────── */
.combo{position:relative}
.combo .inp{width:100%;padding-right:30px;cursor:pointer}
.filtros .combo{flex:0 1 auto;min-width:168px}
.filtros .combo .inp{min-width:0;padding:7.5px 30px 7.5px 11px;font-size:12.5px}
.combo__fl{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  color:var(--marron-3);pointer-events:none}
.combo.abierto .combo__fl{transform:translateY(-50%) rotate(180deg)}
.lista-pop{position:fixed;z-index:650;display:none;background:var(--blanco);border:1px solid var(--borde-fuerte);
  border-radius:11px;box-shadow:0 12px 34px rgba(59,49,41,.20);overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:5px}
.lista-pop.abierto{display:block}
.lista-op{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;
  padding:10px 11px;font-family:inherit;font-size:13.5px;color:var(--marron);line-height:1.35;cursor:pointer}
.lista-op:hover,.lista-op.on{background:#F6EEDF;color:var(--oro-oscuro)}
.lista-op small{display:block;font-size:11px;color:var(--marron-3);margin-top:1px}
.lista-op.on small{color:var(--oro-oscuro);opacity:.8}
.lista-vacia{padding:12px;font-size:12.5px;color:var(--marron-3);text-align:center}

/* ── Fotos de evolución ─────────────────────────────────────────── */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.foto{position:relative;margin:0;border:1px solid var(--borde);border-radius:var(--r-sm);overflow:hidden;background:var(--crema-2)}
.foto img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in}
.foto__pie{padding:6px 8px;font-size:10.5px;line-height:1.35}
.foto__pie b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--marron-3)}
.foto__x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(59,49,41,.62);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.foto:hover .foto__x,.foto:focus-within .foto__x{opacity:1}
.foto__x svg{width:13px;height:13px}
.foto__et{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.92);border-radius:99px;
  padding:2px 8px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--marron)}
@media (hover:none){ .foto__x{opacity:1} }
.lightbox{position:fixed;inset:0;z-index:500;background:rgba(59,49,41,.9);display:none;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:92vh;border-radius:10px;box-shadow:var(--sombra-alta)}
.dropzone{border:1.5px dashed var(--borde-fuerte);border-radius:var(--r);padding:20px;text-align:center;
  background:var(--crema-2);cursor:pointer;transition:.16s}
.dropzone:hover,.dropzone.sobre{border-color:var(--oro);background:#FCF8F1}
.dropzone svg{width:26px;height:26px;color:var(--oro);opacity:.75;margin-bottom:6px}

/* ── Pantalla de presentación de Wydan ──────────────────────────
   Identidad de WYDAN (no de la clínica): azul marino, gris acero,
   Poppins e Inter. Los colores de ALMAS aparecen solo en la maqueta.
   ─────────────────────────────────────────────────────────────── */
:root{
  --w-azul:#14294A; --w-azul-2:#1B3A5B; --w-acero:#6E7C8C; --w-plata:#9AA6B2;
  --w-fondo:#F4F6F9; --w-borde:#E2E8F0; --w-texto:#5A6773;
  --w-sombra:0 10px 30px rgba(20,41,74,.10); --w-sombra-fuerte:0 18px 50px rgba(20,41,74,.20);
}
#bienvenida{position:fixed;inset:0;z-index:600;overflow:auto;display:flex;align-items:flex-start;
  justify-content:center;padding:40px 18px;font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(900px 420px at 50% -8%,#e6ebf3 0%,transparent 62%),var(--w-fondo)}
#bienvenida.off{display:none}
.bv-in{width:100%;max-width:660px;text-align:center;margin:auto}
.bv-marca{margin-bottom:30px}
.bv-marca img{width:224px;max-width:60%;height:auto;display:block;margin:0 auto}
.bv-para{font-size:10.5px;letter-spacing:3.6px;text-transform:uppercase;color:var(--w-plata);font-weight:600}
.bv-t{font-family:'Poppins',system-ui,sans-serif;font-size:33px;font-weight:700;color:var(--w-azul);
  line-height:1.15;letter-spacing:-.4px;margin-top:8px}
.bv-s{font-size:11px;letter-spacing:3.4px;text-transform:uppercase;color:var(--w-acero);margin-top:9px;font-weight:500}
.bv-frase{font-size:16.5px;line-height:1.6;color:var(--w-texto);margin:22px auto 0;max-width:480px}
.bv-vista{margin:30px auto 26px;max-width:520px}
.bv-btn{display:inline-flex;align-items:center;gap:10px;background:var(--w-azul);color:#fff;border:0;cursor:pointer;
  padding:15px 30px;border-radius:10px;font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.3px;box-shadow:var(--w-sombra);transition:transform .18s,background .18s,box-shadow .18s}
.bv-btn:hover{background:var(--w-azul-2);transform:translateY(-2px);box-shadow:var(--w-sombra-fuerte)}
.bv-btn b{display:inline-block;transition:transform .18s}
.bv-btn:hover b{transform:translateX(5px)}
.bv-pie{margin-top:26px;font-size:12px;color:var(--w-plata)}
.bv-lista{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:20px;
  font-size:12.5px;color:var(--w-texto)}
.bv-lista span{display:inline-flex;align-items:center;gap:6px}
.bv-lista i{width:5px;height:5px;border-radius:50%;background:var(--w-acero);display:inline-block}
/* Maqueta a escala de la pantalla de trabajo: acá sí van los colores de ALMAS */
.bv-prev{border-radius:14px;overflow:hidden;padding:20px;box-shadow:var(--w-sombra-fuerte);
  background:linear-gradient(160deg,#22456f 0%,#0c1c34 100%)}
.mini-app{width:100%;overflow:hidden;border-radius:8px;background:var(--crema);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.mini-top{display:flex;align-items:center;gap:8px;padding:0 11px;height:32px;background:#fff;border-bottom:1px solid var(--borde)}
.mini-mark{width:19px;height:19px;background:var(--oro-grad);border-radius:50%}
.mini-name{height:6px;width:76px;background:#D9CBB2;border-radius:2px}
.mini-nav{display:flex;align-items:flex-end;padding:0 11px;height:17px;gap:6px;background:#fff}
.mini-tab{height:11px;width:36px;background:var(--crema);border-radius:4px 4px 0 0}
.mini-tab.on{background:#F0E3C9;box-shadow:inset 0 -3px 0 var(--oro)}
.mini-body{padding:11px}
.mini-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:10px}
.mini-kpi{height:36px;background:#fff;border:1px solid var(--borde);border-radius:5px;position:relative}
.mini-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:5px 0 0 5px;background:var(--oro)}
.mini-kpi:nth-child(2)::before{background:var(--salvia)}
.mini-kpi:nth-child(3)::before{background:var(--terra)}
.mini-tb{background:#fff;border:1px solid var(--borde);border-radius:5px;overflow:hidden}
.mini-th{height:13px;background:#EFE6D6}
.mini-tr{height:13px;border-top:1px solid #F1EBE1}
@keyframes bvUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bv-in>*{animation:bvUp .55s cubic-bezier(.2,.7,.3,1) both}
.bv-marca{animation-delay:.03s} .bv-para{animation-delay:.10s} .bv-t{animation-delay:.14s}
.bv-s{animation-delay:.20s} .bv-frase{animation-delay:.28s} .bv-vista{animation-delay:.38s}
.bv-btn{animation-delay:.50s} .bv-lista{animation-delay:.56s} .bv-pie{animation-delay:.62s}
@media (max-width:700px){
  #bienvenida{padding:26px 16px}
  .bv-t{font-size:26px} .bv-frase{font-size:15px} .bv-marca img{width:186px}
  .bv-prev{padding:13px;border-radius:11px}
}
/* Volver a la presentación desde la pantalla de contraseña */
.lock__volver{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:8px 15px;border-radius:99px;
  font-size:11.5px;font-weight:700;color:var(--oro-oscuro);background:#F6EEDF;border:1px solid #EADCC0;
  cursor:pointer;transition:.15s}
.lock__volver:hover{background:var(--oro);color:#fff;border-color:transparent}
.lock__pie img,.nav__pie img{height:27px;width:auto;display:block}
.lock__pie,.nav__pie{gap:7px}

/* ── Responsive ─────────────────────────────────────────────────── */
@media (max-width:1180px){ .g5{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1024px){
  :root{--nav-w:262px}
  .nav{transform:translateX(-100%);box-shadow:var(--sombra-alta)}
  .nav.on{transform:none}
  .main{margin-left:0}
  .burger{display:flex}
  .g3{grid-template-columns:minmax(0,1fr)}
  .sem{grid-template-columns:repeat(7,minmax(112px,1fr))}
}
@media (max-width:860px){ .g-2-1,.g-1-2{grid-template-columns:minmax(0,1fr)} }
/* En celular la barra superior pasa a dos líneas: título arriba,
   botones abajo a lo ancho, cómodos para tocar con el pulgar. */
@media (max-width:640px){
  .topbar{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 12px 10px}
  .topbar__t{flex:1 1 auto;min-width:0}
  .topbar__t h1{font-size:13px;letter-spacing:.12em}
  #tbAcc{flex:1 1 100%;gap:6px}
  #tbAcc .btn{flex:1 1 auto;justify-content:center}
}
@media (max-width:720px){
  body{font-size:13.5px}
  .vista{padding:14px 13px 80px}
  .g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}
  .kpi__v{font-size:20px}
  .modal__box{max-height:96vh}
  .modal__b{padding:15px}
  .modal__f{padding:11px 15px}
  .modal__f .btn{flex:1}
  .cal__d{min-height:62px;padding:3px}
  .cal__ev{font-size:8px;padding:1px 3px}
  .filtros .inp{flex:1;min-width:120px}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .barh__n{flex:0 0 92px}
}
@media (max-width:420px){ .dl{grid-template-columns:minmax(0,1fr)} .turno__h{flex:0 0 50px} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .lock__luz{animation:none}
}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:4px}

/* ── Impresión (A4): solo el documento ──────────────────────────── */
@media print{
  @page{size:A4;margin:14mm 13mm}
  body{background:#fff}
  #lock,#app,#toasts,.modal{display:none!important}
  #printArea{display:block!important}
  .noprint{display:none!important}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid}
  h2{page-break-after:avoid}
}

<script>
"use strict";
/* ███████████████████████████████████████████████████████████████████
   ALMAS · SISTEMA DE GESTIÓN CLÍNICA
   Wydan Solutions — archivo único, sin frameworks.
   ───────────────────────────────────────────────────────────────────
   ÍNDICE
     1. Identidad: logos SVG e íconos
     2. Configuración editable (CONFIG)
     3. CAPA DE DATOS (STORE)  ← se reemplaza por Firebase sin tocar la UI
     4. Datos de ejemplo (SEED)
     5. Motor clínico: alertas, contraindicaciones y sugerencias
     6. Utilidades de interfaz
     7. Secciones: Panel · Agenda · Pacientes · Tratamientos · Finanzas ·
        Proveedores · Stock · Personal · Servicios
     8. Documentos imprimibles y exportación
     9. Arranque
   ███████████████████████████████████████████████████████████████████ */

/* ═══════════════════════════════════════════════════════════════════
   1 · IDENTIDAD — LOGOS
   LOGO_ALMAS: recreación vectorial del logo (círculo abierto, "A",
   perfil femenino, rama de hojas, "ALMAS", línea con estrella de
   cuatro puntas y "DRA ROSANGELA MENESES").
   Variantes:  .completo  (bloqueo, impresión)
               .horizontal (barra de navegación)
               .monograma  (favicon / fondo / celular)
   · jpgFallback: si se prefiere el JPG original con relieve, pegar acá
     el data:image en base64 y usar LOGO_ALMAS.conFallback().
   ═══════════════════════════════════════════════════════════════════ */
const ORO_DEFS = (id) => `<defs>
  <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D4B57E"/><stop offset="46%" stop-color="#B8955B"/><stop offset="100%" stop-color="#9C7A44"/>
  </linearGradient></defs>`;

/* Marca (monograma): se reutiliza en las tres variantes */
const HOJA = `<path d="M0,0 C14,-14 38,-14 52,0 C38,14 14,14 0,0 Z"/><path d="M5,0 L47,0"/>`;
const MARCA = (g) => `
<!-- círculo abierto, abierto hacia abajo a la derecha -->
<path d="M67,229 A142,142 0 1 1 323,251" fill="none" stroke="url(#${g})" stroke-width="4.6" stroke-linecap="round"/>
<!-- letra A: trazo izquierdo fino, derecho grueso, con serifas -->
<g fill="url(#${g})">
  <path d="M200,58 L309,348 L277,348 L197,98 Z"/>
  <path d="M200,58 L94,348 L111,348 L205,98 Z"/>
  <rect x="85" y="342" width="37" height="6" rx="3"/>
  <rect x="267" y="342" width="56" height="6" rx="3"/>
</g>
<!-- perfil femenino de línea fina, dentro de la A -->
<path d="M156,342 C142,292 150,242 190,230 C224,220 252,236 258,258
         C260,268 258,272 256,276 L284,298 C287,300 286,303 282,304
         L270,308 C275,314 272,318 266,318 C268,325 262,330 254,329
         C244,340 192,350 168,342"
      fill="none" stroke="url(#${g})" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<!-- rama de hojas -->
<g stroke="url(#${g})" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M298,352 C332,304 352,238 356,146" stroke-width="3.2"/>
  <g stroke-width="2.4">
    <g transform="translate(312,308) rotate(-36) scale(1.18)">${HOJA}</g>
    <g transform="translate(308,314) rotate(-152) scale(.95)">${HOJA}</g>
    <g transform="translate(330,250) rotate(-32) scale(1.25)">${HOJA}</g>
    <g transform="translate(325,256) rotate(-156) scale(.95)">${HOJA}</g>
    <g transform="translate(344,194) rotate(-28) scale(1.12)">${HOJA}</g>
    <g transform="translate(352,150) rotate(-64) scale(.88)">${HOJA}</g>
  </g>
</g>`;

const ESTRELLA4 = (f) => `<path transform="translate(380,528)" fill="${f}" d="M0,-13 C1.8,-4.2 4.2,-1.8 13,0 C4.2,1.8 1.8,4.2 0,13 C-1.8,4.2 -4.2,1.8 -13,0 C-4.2,-1.8 -1.8,-4.2 0,-13 Z"/>`;

/* Cada instancia lleva su propio id de degradé: dos SVG en la misma página
   no pueden compartirlo (al imprimir, el original queda oculto y el oro se pierde). */
let _oroN = 0;
const nuevoOro = () => 'oro'+(++_oroN);

const LOGO_ALMAS = {
  jpgFallback: '', /* ← pegar aquí "data:image/jpeg;base64,..." si se quiere el original con relieve */

  completo(){ const g = nuevoOro(); return `<svg viewBox="0 0 760 620" role="img" aria-label="ALMAS — Dra. Rosangela Meneses" xmlns="http://www.w3.org/2000/svg">
  ${ORO_DEFS(g)}
  <g transform="translate(180,8)">${MARCA(g)}</g>
  <text x="363" y="486" text-anchor="middle" fill="url(#${g})" font-family="Cinzel,Marcellus,Georgia,serif"
        font-size="106" letter-spacing="34" font-weight="500">ALMAS</text>
  <g stroke="#C9AE80" stroke-width="1.3"><path d="M212,528 H352"/><path d="M408,528 H548"/></g>
  ${ESTRELLA4('#B8955B')}
  <text x="376" y="578" text-anchor="middle" fill="#A98A5C" font-family="Montserrat,sans-serif"
        font-size="23" letter-spacing="8.6" font-weight="500">DRA ROSANGELA MENESES</text>
</svg>`; },

  horizontal(){ const g = nuevoOro(); return `<svg viewBox="0 0 560 158" role="img" aria-label="ALMAS" xmlns="http://www.w3.org/2000/svg">
  ${ORO_DEFS(g)}
  <g transform="translate(2,6) scale(.355)">${MARCA(g)}</g>
  <text x="158" y="74" fill="url(#${g})" font-family="Cinzel,Marcellus,Georgia,serif"
        font-size="46" letter-spacing="15" font-weight="500">ALMAS</text>
  <g stroke="#C9AE80" stroke-width="1"><path d="M160,96 H288"/><path d="M308,96 H436"/></g>
  <path transform="translate(298,96)" fill="#B8955B" d="M0,-6.5 C.9,-2.1 2.1,-.9 6.5,0 C2.1,.9 .9,2.1 0,6.5 C-.9,2.1 -2.1,.9 -6.5,0 C-2.1,-.9 -.9,-2.1 0,-6.5 Z"/>
  <text x="160" y="122" fill="#A98A5C" font-family="Montserrat,sans-serif"
        font-size="11.4" letter-spacing="4.1" font-weight="500">DRA ROSANGELA MENESES</text>
</svg>`; },

  monograma(){ const g = nuevoOro(); return `<svg viewBox="0 0 400 400" role="img" aria-label="A" xmlns="http://www.w3.org/2000/svg">
  ${ORO_DEFS(g)}${MARCA(g)}</svg>`; },

  /* Si hay JPG cargado lo usa; si no, devuelve el SVG. */
  conFallback(v){ return this.jpgFallback ? `<img src="${this.jpgFallback}" alt="ALMAS" style="width:100%;height:auto">` : this[v||'completo'](); }
};

/* ── Logo de Wydan Solutions ──────────────────────────────────────
   Es el mismo archivo que usamos en todas nuestras páginas
   (Maria-Lucia-Furtado/public/img/wydan-horizontal.png), embebido en

/* ═══════════════════════════════════════════════════════════════════
   3 · CAPA DE DATOS (STORE)  ← ★ PUNTO DE CONEXIÓN A LA NUBE ★
   ───────────────────────────────────────────────────────────────────
   Toda la interfaz habla ÚNICAMENTE con estas funciones.
   Para persistir en Firebase (u otra base) se reemplaza el cuerpo de
   list / get / crear / editar / borrar por llamadas a Firestore y se
   deja el resto del archivo intacto:

     import {getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc}
       from 'firebase/firestore';
     async list(col,f){ const s = await getDocs(collection(db,col)); ... }
     // y un onSnapshot(col, ()=> router()) para refrescar en vivo.

   Colecciones: pacientes · servicios · turnos · tratamientos ·
   consentimientos · movimientos · proveedores · compras · productos ·
   personal · asistencias · pagos
   ═══════════════════════════════════════════════════════════════════ */
const STORE = (function(){
  const DB = { pacientes:[], servicios:[], turnos:[], tratamientos:[], consentimientos:[],
               movimientos:[], proveedores:[], compras:[], productos:[], personal:[],
               asistencias:[], pagos:[] };
  const seq = {};
  function nid(pref){ seq[pref]=(seq[pref]||0)+1; return pref+String(seq[pref]).padStart(5,'0'); }
  const suscriptores = [];

  return {
    _db: DB,
    nid,
    /** Devuelve una copia filtrada de la colección */
    list(col, filtro){ const a = DB[col]||[]; return filtro ? a.filter(filtro) : a.slice(); },
    /** Un registro por id */
    get(col, id){ return (DB[col]||[]).find(x=>x.id===id) || null; },
    /** Alta. Devuelve el registro creado (con id) */
    crear(col, obj){ const r = Object.assign({ id: obj.id || nid(col.slice(0,2)) }, obj);
      DB[col].push(r); this.emitir(col); return r; },
    /** Modificación parcial */
    editar(col, id, cambios){ const r = this.get(col,id); if(!r) return null;
      Object.assign(r, cambios); this.emitir(col); return r; },
    /** Baja */
    borrar(col, id){ const i = DB[col].findIndex(x=>x.id===id); if(i<0) return false;
      DB[col].splice(i,1); this.emitir(col); return true; },
    /** Carga masiva (sólo la usa el seed) */
    cargar(col, arr){ DB[col] = arr; },
    /** Avisos de cambio: así se enchufa onSnapshot más adelante */
    alCambiar(fn){ suscriptores.push(fn); },
    emitir(col){ suscriptores.forEach(f=>{ try{ f(col); }catch(e){ console.warn(e); } }); }
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   UTILIDADES DE FECHA, NÚMERO Y TEXTO
   ═══════════════════════════════════════════════════════════════════ */
const MESES  = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES3 = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const DOW    = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOW3   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

const HOY = new Date(); HOY.setHours(0,0,0,0);
const z2 = n => String(n).padStart(2,'0');
/** Date → 'YYYY-MM-DD' */
const iso = d => d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
/** 'YYYY-MM-DD' → Date (local, sin corrimiento de zona horaria) */
const dt  = s => { const p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const HOY_ISO = iso(HOY);
const addD = (s,n) => { const d = dt(s); d.setDate(d.getDate()+n); return iso(d); };
const addM = (s,n) => { const d = dt(s); d.setMonth(d.getMonth()+n); return iso(d); };
const difD = (a,b) => Math.round((dt(b)-dt(a))/86400000);
const mesK = s => String(s).slice(0,7);                       // 'YYYY-MM'
const mesNom = k => MESES[+k.slice(5,7)-1]+' '+k.slice(0,4);
const mesNom3 = k => MESES3[+k.slice(5,7)-1]+" '"+k.slice(2,4);
const finMes = k => { const [a,m]=k.split('-').map(Number); return new Date(a,m,0).getDate(); };
/** '14/10/2026' | '14 oct 2026' | 'mié 14 oct' */
function fF(s,m){ if(!s) return '—'; const d=dt(s);
  if(m==='largo') return d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();
  if(m==='corto') return d.getDate()+' '+MESES3[d.getMonth()]+' '+d.getFullYear();
  if(m==='dia')   return DOW3[d.getDay()]+' '+d.getDate()+' '+MESES3[d.getMonth()];
  return z2(d.getDate())+'/'+z2(d.getMonth()+1)+'/'+d.getFullYear(); }
/** Dinero en pesos uruguayos */
const $$ = n => '$ '+Math.round(n||0).toLocaleString('es-UY');
const $k = n => Math.abs(n)>=1000 ? '$ '+Math.round(n/1000)+'k' : '$ '+Math.round(n||0);
const nmb = n => Math.round(n||0).toLocaleString('es-UY');
const pct = (a,b) => b ? Math.round(a/b*1000)/10 : 0;
const edad = s => { if(!s) return '—'; const d=dt(s), h=HOY; let e=h.getFullYear()-d.getFullYear();
  if(h.getMonth()<d.getMonth()||(h.getMonth()===d.getMonth()&&h.getDate()<d.getDate())) e--; return e; };
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ini = n => n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const lunesDe = s => { const d=dt(s); const w=(d.getDay()+6)%7; return addD(s,-w); };

/* Generador pseudoaleatorio con semilla: los datos de demo son siempre los mismos */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const RND = mulberry(20261014);
const ri  = (a,b) => a+Math.floor(RND()*(b-a+1));
const pk  = a => a[Math.floor(RND()*a.length)];
const chance = p => RND() < p;
function pkN(a,n){ const c=a.slice(), o=[]; while(o.length<n && c.length) o.push(c.splice(Math.floor(RND()*c.length),1)[0]); return o; }

function paramsDe(s){
  const t=s.tags;
  if(t.includes('tatuaje')) return {Fluencia:(2.4+RND()*1.6).toFixed(1)+' J/cm²', Spot:ri(3,5)+' mm', Pulso:'ns', Pasadas:1};
  if(t.includes('pigmento'))return {Fluencia:(1.6+RND()*1.6).toFixed(1)+' J/cm²', Spot:ri(4,7)+' mm', Pulso:'ns', Pasadas:1};
  if(t.includes('depilacion'))return{Fluencia:ri(12,22)+' J/cm²', Spot:ri(12,18)+' mm', Pulso:ri(15,40)+' ms', Pasadas:ri(1,2)};
  if(t.includes('carbon'))  return {Fluencia:(1.2+RND()*.8).toFixed(1)+' J/cm²', Spot:ri(6,8)+' mm', Pasadas:ri(2,3)};
  if(t.includes('dermapen'))return {Profundidad:(0.5+RND()*1.5).toFixed(1)+' mm', Velocidad:ri(8,12)+'k rpm', Pasadas:ri(3,4)};
  if(t.includes('prp'))     return {Volumen:ri(8,12)+' ml', Centrifugado:'3.200 rpm / 8 min', Técnica:pk(['Retroinyección','Punto a punto','Nappage'])};
  if(t.includes('rf'))      return {Temperatura:ri(40,42)+' °C', Tiempo:ri(20,35)+' min', Potencia:ri(60,85)+' %'};
  return {Duración:s.dur+' min'};
}

(function seedAgenda(){
  const turnos=[], trats=[], cons=[], ocupado=new Set();
  const kHoy = mesK(HOY_ISO);
  const meses=[]; let k='2022-01';
  while(k<=kHoy){ meses.push(k); k=mesK(addM(k+'-01',1)); }

  const multiSes = SERVICIOS.filter(s=>s.sesiones>1);
  /* sv24 (lesiones) y sv29 (valoración) se agendan aparte, con su regla propia */
  const unicos   = SERVICIOS.filter(s=>s.sesiones===1 && s.id!=='sv24' && s.id!=='sv29');
  const depil    = SERVICIOS.filter(s=>s.tags.includes('depilacion'));
  const corp     = SERVICIOS.filter(s=>s.tags.includes('rf'));
  const faciales = SERVICIOS.filter(s=>s.cat==='Facial');

  /* Estacionalidad: más depilación en otoño/invierno, más corporal antes del verano */
  function srvDelMes(mk, soloMulti){
    const m=+mk.slice(5,7), r=RND();
    if(m>=4&&m<=8){ if(r<.50) return pk(depil); }
    else if(m>=9||m<=1){ if(r<.28) return pk(corp); if(r<.50) return pk(depil); }
    else if(r<.38) return pk(depil);
    const pool = soloMulti ? multiSes : SERVICIOS.filter(s=>s.id!=='sv24'&&s.id!=='sv29');
    return pk(pool);
  }
  /* Día hábil al azar dentro del mes */
  function diaDe(mk, desde){
    for(let i=0;i<30;i++){ const d = mk+'-'+z2(ri(1, finMes(mk)));
      if(esLaboral(d) && (!desde || d>=desde)) return d; }
    return null;
  }
  /* Reserva de horario en grilla de 15 min, sin superposición por profesional */
  function reservar(fecha, prof, dur){
    const sab = dt(fecha).getDay()===6, tope = sab?52:76, n=Math.ceil(dur/15);
    for(let t=0;t<26;t++){
      const s = ri(36, tope-n);
      let ok=true; for(let i=0;i<n;i++) if(ocupado.has(prof+fecha+(s+i))){ ok=false; break; }
      if(ok){ for(let i=0;i<n;i++) ocupado.add(prof+fecha+(s+i));
        return z2(Math.floor(s/4))+':'+z2((s%4)*15); }
    }
    return null;
  }
  const profDe = s => (s.cat==='Médico'||s.cat==='Láser'||s.cat==='Consulta') ? CONFIG.profesionales[0]
                    : (chance(.55) ? CONFIG.profesionales[1] : CONFIG.profesionales[0]);
  const activosA = f => PAC.filter(p=>p.alta<=f);

  let nT=0, nTr=0;
  function nuevoTurno(o){ const id='tu'+z2(Math.floor(nT/10000))+String(nT%10000).padStart(4,'0'); nT++;
    turnos.push(Object.assign({id, nota:'', tratamientoId:null, sesion:null}, o)); return turnos[turnos.length-1]; }

  /* ── 1. Planes de tratamiento repartidos en todo el período ──── */
  meses.forEach(mk=>{
    const y=+mk.slice(0,4);
    const cant = y<=2022? ri(1,3) : y===2023? ri(2,4) : ri(3,5);
    for(let c=0;c<cant;c++){
      const inicio = diaDe(mk); if(!inicio) continue;
      const cands = activosA(inicio); if(!cands.length) continue;
      const p = pk(cands);
      const s = srvDelMes(mk, true);
      if(!s || s.sesiones<2) continue;
      /* no proponemos algo contraindicado para esa paciente */
      if(contraindicacion(p, s).nivel === 'bloquea') continue;
      const total = s.sesiones + ri(-1,2);
      const tid = 'tr'+z2(Math.floor(nTr/100))+z2(nTr%100); nTr++;
      const t = { id:tid, pacienteId:p.id, servicioId:s.id, zona:s.zona, sesionesTot:Math.max(3,total),
        frec:s.frec, inicio, modo:'sesion', precioSesion:s.precio, precioPaquete:0, cuotas:0,
        estado:'En curso', obs:'' };
      trats.push(t);
      /* sesiones del plan */
      let f = inicio;
      for(let i=0;i<t.sesionesTot;i++){
        if(i) f = addD(f, t.frec + ri(-4,7));
        while(!esLaboral(f)) f = addD(f,1);
        if(difD(HOY_ISO, f) > 38) break;                      // no agendamos tan lejos
        const prof = profDe(s), hora = reservar(f, prof, s.dur);
        if(!hora) continue;
        const pasado = f < HOY_ISO;
        const tu = nuevoTurno({ fecha:f, hora, dur:s.dur, pacienteId:p.id, servicioId:s.id, prof,
          estado: pasado ? (chance(.045)?'No asistió':'Realizado') : (f===HOY_ISO? (chance(.5)?'Confirmado':'Realizado') : (chance(.6)?'Confirmado':'Pendiente')),
          precio:s.precio, tratamientoId:tid });
        if(tu.estado==='Realizado'){
          tu.sesion = { n:i+1, params:paramsDe(s), reaccion:pk(REACCIONES),
            nota: pk(EVOLUCION[s.indic]||EVOLUCION.facial), indic:s.post };
        }
      }
      /* consentimiento informado */
      if(s.tags.some(x=>['laser','prp','invasivo','dermapen'].includes(x))){
        cons.push({ id:'co'+String(cons.length+1).padStart(4,'0'), pacienteId:p.id, tratamientoId:tid,
          tipo: s.tags.includes('prp')?'PRP': s.tags.includes('invasivo')&&!s.tags.includes('laser')?'Lesiones cutáneas':'Láser',
          fecha: inicio, estado:'Firmado' });
      }
    }
  });

  /* ── 2. Sesiones sueltas hasta llegar al volumen de cada mes ─── */
  const porMes = {}; turnos.forEach(t=>{ porMes[mesK(t.fecha)] = (porMes[mesK(t.fecha)]||0)+1; });
  function meta(mk){ const y=+mk.slice(0,4);
    let m = y<=2022? ri(21,28) : y===2023? ri(29,38) : y===2024? ri(37,48) : y===2025? ri(44,56) : ri(48,62);
    if(mk===kHoy) m = Math.round(m * (dt(HOY_ISO).getDate()/finMes(mk)) ) + ri(8,14); // mes en curso + agenda futura
    return m; }
  meses.forEach(mk=>{
    const falta = meta(mk) - (porMes[mk]||0);
    for(let i=0;i<falta;i++){
      const f = diaDe(mk); if(!f) continue;
      const cands = activosA(f); if(!cands.length) continue;
      const p = pk(cands);
      const s = chance(.68) ? pk(unicos) : srvDelMes(mk);
      if(!s) continue;
      const prof = profDe(s), hora = reservar(f, prof, s.dur); if(!hora) continue;
      const pasado = f < HOY_ISO;
      const tu = nuevoTurno({ fecha:f, hora, dur:s.dur, pacienteId:p.id, servicioId:s.id, prof,
        estado: pasado ? (chance(.05)?pk(['No asistió','Cancelado']):'Realizado')
                       : (f===HOY_ISO ? (chance(.45)?'Realizado':'Confirmado') : (chance(.62)?'Confirmado':'Pendiente')),
        precio:s.precio });
      if(tu.estado==='Realizado') tu.sesion = { n:1, params:paramsDe(s), reaccion:pk(REACCIONES),
        nota: pk(EVOLUCION[s.indic]||EVOLUCION.facial), indic:s.post };
    }
  });

  /* ── 3. Agenda de las próximas 3 semanas ─────────────────────── */
  for(let d=1; d<=23; d++){
    const f = addD(HOY_ISO, d); if(!esLaboral(f)) continue;
    const cant = dt(f).getDay()===6 ? ri(2,4) : ri(3,7);
    for(let i=0;i<cant;i++){
      const p = pk(PAC), s = pk(SERVICIOS.filter(x=>x.id!=='sv24'));
      const prof = profDe(s), hora = reservar(f, prof, s.dur); if(!hora) continue;
      nuevoTurno({ fecha:f, hora, dur:s.dur, pacienteId:p.id, servicioId:s.id, prof,
        estado: d<=7 ? (chance(.75)?'Confirmado':'Pendiente') : (chance(.45)?'Confirmado':'Pendiente'), precio:s.precio });
    }
  }

  /* ── 4. Día de hoy: una jornada completa y realista ──────────── */
  (function(){
    const yaHoy = turnos.filter(t=>t.fecha===HOY_ISO).length;
    for(let i=yaHoy;i<8;i++){
      const p = pk(PAC), s = pk(SERVICIOS.filter(x=>x.id!=='sv24'));
      const prof = profDe(s), hora = reservar(HOY_ISO, prof, s.dur); if(!hora) continue;
      const tmp = nuevoTurno({ fecha:HOY_ISO, hora, dur:s.dur, pacienteId:p.id, servicioId:s.id, prof,
        estado:'Confirmado', precio:s.precio });
      if(+hora.slice(0,2) < new Date().getHours()-1){ tmp.estado='Realizado';
        tmp.sesion={ n:1, params:paramsDe(s), reaccion:pk(REACCIONES), nota:pk(EVOLUCION[s.indic]||EVOLUCION.facial), indic:s.post }; }
    }
    /* una paciente con contraindicación en la agenda de hoy, para que se vea la alerta */
    const pe = PAC[3], sl = svc('sv06');
    const h = reservar(HOY_ISO, CONFIG.profesionales[0], sl.dur);
    if(h) nuevoTurno({ fecha:HOY_ISO, hora:h, dur:sl.dur, pacienteId:pe.id, servicioId:sl.id,
      prof:CONFIG.profesionales[0], estado:'Pendiente', precio:sl.precio,
      nota:'Revisar contraindicación antes de confirmar.' });
  })();

  /* ── 4 bis. Tres planes con el control atrasado (no volvieron) ─ */
  pkN(PAC.filter(p=>p.alta < addD(HOY_ISO,-200)), 6).forEach((p,i)=>{
    if(i>=3) return;
    const s = [svc('sv06'), svc('sv12'), svc('sv20')][i];
    if(contraindicacion(p, s).nivel==='bloquea') return;
    const hechas = ri(2,4), atraso = ri(16,42);
    const tid = 'tr'+z2(Math.floor(nTr/100))+z2(nTr%100); nTr++;
    let f = addD(HOY_ISO, -(s.frec + atraso) - (hechas-1)*s.frec);
    while(!esLaboral(f)) f = addD(f,1);
    trats.push({ id:tid, pacienteId:p.id, servicioId:s.id, zona:s.zona, sesionesTot:s.sesiones,
      frec:s.frec, inicio:f, modo:'sesion', precioSesion:s.precio, precioPaquete:0, cuotas:0,
      estado:'Control atrasado', obs:'La paciente no volvió a agendar. Llamar para retomar.' });
    for(let k2=0; k2<hechas; k2++){
      if(k2) { f = addD(f, s.frec); while(!esLaboral(f)) f = addD(f,1); }
      const prof = profDe(s), hora = reservar(f, prof, s.dur); if(!hora) continue;
      const tu = nuevoTurno({ fecha:f, hora, dur:s.dur, pacienteId:p.id, servicioId:s.id, prof,
        estado:'Realizado', precio:s.precio, tratamientoId:tid });
      tu.sesion = { n:k2+1, params:paramsDe(s), reaccion:pk(REACCIONES),
        nota: pk(EVOLUCION[s.indic]||EVOLUCION.facial), indic:s.post };
    }
    cons.push({ id:'co'+String(cons.length+1).padStart(4,'0'), pacienteId:p.id, tratamientoId:tid,
      tipo: s.tags.includes('dermapen')?'Dermapen':'Láser', fecha:trats[trats.length-1].inicio, estado:'Firmado' });
  });

  /* ── 5. Estado de cada plan ──────────────────────────────────── */
  trats.forEach(t=>{
    const ses = turnos.filter(x=>x.tratamientoId===t.id && x.estado==='Realizado').sort((a,b)=>a.fecha<b.fecha?-1:1);
    const fut = turnos.some(x=>x.tratamientoId===t.id && x.fecha>=HOY_ISO && ['Pendiente','Confirmado'].includes(x.estado));
    const ult = ses.length ? ses[ses.length-1].fecha : t.inicio;
    const atraso = difD(addD(ult, t.frec), HOY_ISO);          // días pasados del control
    if(ses.length>=t.sesionesTot) t.estado='Finalizado';
    else if(fut) t.estado='En curso';
    else if(atraso > 60){ t.estado='Finalizado';               // plan abandonado: se cierra
      t.obs='Plan cerrado sin completar — la paciente no retomó.'; }
    else t.estado = atraso > 12 ? 'Control atrasado' : 'En curso';
  });
  /* 2 planes pausados a pedido de la paciente */
  pkN(trats.filter(t=>t.estado==='En curso'), 2).forEach(t=>{ t.estado='Pausado';
    t.obs='Pausado a pedido de la paciente — retoma cuando avise.'; });

  /* ── 6. Plan con paquete en cuotas (cobros pendientes) ───────── */
  pkN(trats.filter(t=>t.estado==='En curso'), 3).forEach(t=>{
    const s = svc(t.servicioId);
    t.modo='paquete'; t.cuotas=3;
    t.precioPaquete = Math.round(s.precio * t.sesionesTot * 0.85 / 100)*100;
  });

  /* ── 7. Valoraciones realizadas sin tratamiento + lesiones ──── */
  const sv29=svc('sv29'), sv24=svc('sv24');
  pkN(PAC.filter(p=>p.activo), 6).forEach((p,i)=>{
    const f = addD(HOY_ISO, -ri(3,24)); if(!esLaboral(f)) return;
    const h = reservar(f, CONFIG.profesionales[0], sv29.dur); if(!h) return;
    const tu = nuevoTurno({ fecha:f, hora:h, dur:sv29.dur, pacienteId:p.id, servicioId:'sv29',
      prof:CONFIG.profesionales[0], estado:'Realizado', precio:sv29.precio,
      nota:'Valoración de lesiones cutáneas. Se propone eliminación.' });
    tu.sesion={ n:1, params:{Duración:'20 min'}, reaccion:'—', nota:pk(EVOLUCION.consulta), indic:'' };
    /* 2 de ellas ya hicieron la eliminación */
    if(i<2){ const f2=addD(f,ri(5,12)); if(!esLaboral(f2)) return;
      const h2=reservar(f2, CONFIG.profesionales[0], sv24.dur); if(!h2) return;
      const t2=nuevoTurno({ fecha:f2, hora:h2, dur:sv24.dur, pacienteId:p.id, servicioId:'sv24',
        prof:CONFIG.profesionales[0], estado: f2<HOY_ISO?'Realizado':'Confirmado', precio:sv24.precio });
      if(t2.estado==='Realizado') t2.sesion={ n:1, params:paramsDe(sv24), reaccion:'Costra serohemática', nota:pk(EVOLUCION.lesiones), indic:sv24.post };
      cons.push({ id:'co'+String(cons.length+1).padStart(4,'0'), pacienteId:p.id, tratamientoId:null,
        tipo:'Lesiones cutáneas', fecha:f2, estado:'Firmado' });
    }
  });

  /* ── 8. 3 consentimientos pendientes de firma ────────────────── */
  pkN(trats.filter(t=>t.estado==='En curso'), 3).forEach(t=>{
    const c = cons.find(c=>c.tratamientoId===t.id);
    if(c){ c.estado='Pendiente'; c.fecha=''; }
    else cons.push({ id:'co'+String(cons.length+1).padStart(4,'0'), pacienteId:t.pacienteId,
      tratamientoId:t.id, tipo:'Láser', fecha:'', estado:'Pendiente' });
  });

  /* ── 9. Pacientes inactivos (+90 días sin venir) ─────────────── */
  turnos.sort((a,b)=> a.fecha===b.fecha ? (a.hora<b.hora?-1:1) : (a.fecha<b.fecha?-1:1));
  STORE.cargar('turnos', turnos);
  STORE.cargar('tratamientos', trats);
  STORE.cargar('consentimientos', cons);
})();

/* ═══════════════════════════════════════════════════════════════════
   5 · MOTOR CLÍNICO
   Alertas, contraindicaciones y sugerencias de tratamiento.
   Las reglas viven en CONFIG y se editan desde Servicios → Reglas.
   ═══════════════════════════════════════════════════════════════════ */

/** Banderas activas de la anamnesis de un paciente */
function condiciones(p){
  const a = (p && p.anamnesis) || {};
  return {
    embarazo:!!(a.embarazo||a.lactancia), isotretinoina:!!a.isotretinoina, marcapasos:!!a.marcapasos,
    bronceado:!!a.bronceado, herpes:!!a.herpes, fotosensibles:!!a.fotosensibles,
    anticoagulantes:!!a.anticoagulantes, queloides:!!a.queloides, epilepsia:!!a.epilepsia,
    diabetes:!!a.diabetes, alergiaAnest:!!a.alergiaAnest, fototipoAlto:['V','VI'].includes(a.fototipo)
  };
}

/** ¿Este servicio es seguro para este paciente?
 *  → {nivel:null|'precaucion'|'bloquea', motivos:[{nivel,texto}]}            */
function contraindicacion(p, s){
  const c = condiciones(p), out = { nivel:null, motivos:[] };
  if(!s) return out;
  CONFIG.reglasContra.forEach(r=>{
    if(!c[r.cond]) return;
    if(!r.tags.some(t=>s.tags.indexOf(t)>=0)) return;
    out.motivos.push({ nivel:r.nivel, texto:r.label });
    if(r.nivel==='bloquea') out.nivel='bloquea';
    else if(out.nivel!=='bloquea') out.nivel='precaucion';
  });
  return out;
}

/** Etiquetas del bloque fijo de ALERTAS de la ficha */
function alertasPaciente(p){
  const a = (p && p.anamnesis) || {}, out = [];
  if(a.embarazo) out.push({t:'Embarazo', n:'bloquea'});
  if(a.lactancia) out.push({t:'Lactancia', n:'bloquea'});
  if(a.isotretinoina) out.push({t:'Isotretinoína (6 meses)', n:'bloquea'});
  if(a.marcapasos) out.push({t:'Marcapasos / implante metálico', n:'bloquea'});
  if(a.herpes) out.push({t:'Herpes recurrente', n:'bloquea'});
  if(a.bronceado) out.push({t:'Bronceado reciente', n:'bloquea'});
  if(a.anticoagulantes) out.push({t:'Anticoagulantes', n:'precaucion'});
  if(a.fotosensibles) out.push({t:'Medicación fotosensibilizante', n:'precaucion'});
  if(a.queloides) out.push({t:'Antecedente de queloides', n:'precaucion'});
  if(a.epilepsia) out.push({t:'Epilepsia', n:'precaucion'});
  if(a.diabetes) out.push({t:'Diabetes', n:'precaucion'});
  if(a.alergiaAnest) out.push({t:'Alergia a anestésicos', n:'bloquea'});
  if(['V','VI'].includes(a.fototipo)) out.push({t:'Fototipo '+a.fototipo, n:'precaucion'});
  (a.alergias||[]).forEach(x=> out.push({t:'Alergia: '+x, n:'bloquea'}));
  return out;
}

/** ¿Tiene una consulta de valoración realizada? (regla de lesiones cutáneas) */
function tieneValoracion(pid){
  return STORE.list('turnos', t=>t.pacienteId===pid && t.servicioId==='sv29' && t.estado==='Realizado').length>0;
}
/** Bloqueo duro de agenda: servicios que exigen valoración previa */
function faltaValoracion(pid, s){ return !!(s && s.valoracion && !tieneValoracion(pid)); }

/** Tratamientos sugeridos a partir de las necesidades declaradas */
function sugerencias(p){
  const ya = new Set(), out = [];
  (p.necesidades||[]).forEach(n=>{
    (CONFIG.reglasSugerencia[n.nombre]||[]).forEach(sid=>{
      if(ya.has(sid)) return; ya.add(sid);
      const s = svc(sid); if(!s || !s.activo) return;
      const c = contraindicacion(p, s);
      out.push({ servicio:s, necesidad:n.nombre, nivel:c.nivel,
        motivo: c.motivos.map(m=>m.texto).join(' · '),
        valoracion: faltaValoracion(p.id, s) });
    });
  });
  const ord = {null:0, 'precaucion':1, 'bloquea':2};
  return out.sort((a,b)=> (ord[a.nivel]||0)-(ord[b.nivel]||0));
}

/* Helpers de tratamiento */
const sesionesDe = tid => STORE.list('turnos', t=>t.tratamientoId===tid && t.estado==='Realizado')
                               .sort((a,b)=>a.fecha<b.fecha?-1:1);
function proxControl(t){
  const s = sesionesDe(t.id);
  if(t.estado==='Finalizado') return null;
  const futuro = STORE.list('turnos', x=>x.tratamientoId===t.id && x.fecha>=HOY_ISO && ['Pendiente','Confirmado'].includes(x.estado))
                      .sort((a,b)=>a.fecha<b.fecha?-1:1)[0];
  if(futuro) return { fecha:futuro.fecha, agendado:true };
  const base = s.length ? s[s.length-1].fecha : t.inicio;
  return { fecha: addD(base, t.frec), agendado:false };
}
const atrasado = t => { const c = proxControl(t); return !!(c && !c.agendado && c.fecha < HOY_ISO); };

  STORE.cargar('movimientos', mov);
  STORE.cargar('compras', compras.sort((a,b)=>a.fecha<b.fecha?1:-1));

(function seedPersonal(){

  /* Bloque de licencia anual (enero) */
  const anioLic = (+HOY_ISO.slice(0,4)) - (HOY_ISO.slice(5,7) >= '01' ? 0 : 1);
  const licIni = anioLic+'-01-12';
  let f = desde;
  while(f <= HOY_ISO){
    const d = dt(f).getDay();
    if(d>=1 && d<=5){
      let est='P';
      if(esFeriado(f)) est='H';
      else if(f>=licIni && f<=addD(licIni,13)) est='L';
      else { const r=RND(); est = r<.030?'F' : r<.062?'J' : r<.082?'M' : 'P'; }
      asis.push({ id:'as'+asis.length, empleadoId:emp.id, fecha:f, estado:est,
        nota: est==='J'?'Certificado médico presentado' : est==='M'?'Salió al mediodía' : est==='F'?'Sin aviso':'' });
    }
    f = addD(f,1);
  }
  /* Pagos: sueldo mensual + aguinaldo + salario vacacional */
  const mesesP=[]; let k=mesK(desde); const kHoy=mesK(HOY_ISO);
  while(k<=kHoy){ mesesP.push(k); k=mesK(addM(k+'-01',1)); }
  mesesP.forEach(mk=>{
    const pago = addD(mk+'-01', 34); if(pago>HOY_ISO) return;
    const m = MOV.find(x=>x.tipo==='egreso' && x.categoria==='Sueldos' && mesK(x.fecha)===mesK(pago));
    pagos.push({ id:'pg'+String(pagos.length+1).padStart(3,'0'), empleadoId:emp.id,
      fecha: m?m.fecha:pago, periodo:mk, concepto:'Sueldo', monto: m?m.monto:emp.sueldo,
      medio:'Transferencia', movimientoId:m?m.id:null, nota:'' });
  });
  /* Aguinaldo (junio y diciembre) y salario vacacional (enero) */
  const extras = [];
  mesesP.forEach(mk=>{
    const mm = mk.slice(5);
    if(mm==='06' || mm==='12'){
      const semIni = mm==='06' ? addM(mk+'-01',-6) : addM(mk+'-01',-6);
      const bruto = pagos.filter(p=>p.periodo>=mesK(semIni) && p.periodo<mk && p.concepto==='Sueldo')
                         .reduce((a,b)=>a+b.monto,0);
      const monto = Math.round(bruto/12/10)*10;
      if(monto>0) extras.push({ mk, concepto:'Aguinaldo', monto, dia:mk+'-'+(mm==='06'?'28':'20') });
    }
    if(mk.slice(5)==='01'){
      const sueldo = (pagos.find(p=>p.periodo===addM(mk+'-01',-1).slice(0,7))||{}).monto || emp.sueldo;
      extras.push({ mk, concepto:'Salario vacacional', monto: Math.round(sueldo/30*20*0.7/10)*10, dia:mk+'-10' });
    }
  });
  extras.forEach(e=>{
    if(e.dia>HOY_ISO) return;
    const mv = STORE.crear('movimientos', { id:'mo9'+String(pagos.length+1).padStart(4,'0'),
      fecha:e.dia, tipo:'egreso', categoria:'Sueldos',
      concepto:e.concepto+' — '+emp.nombre, monto:e.monto, medio:'Transferencia', estado:'Pagado',
      vencimiento:e.dia, vinculo:'Pago de personal', proyectado:false, nota:'' });
    pagos.push({ id:'pg'+String(pagos.length+1).padStart(3,'0'), empleadoId:emp.id, fecha:e.dia,
      periodo:e.mk, concepto:e.concepto, monto:e.monto, medio:'Transferencia', movimientoId:mv.id, nota:'' });
  });
  pagos.sort((a,b)=>a.fecha<b.fecha?1:-1);
  STORE.cargar('asistencias', asis);
  STORE.cargar('pagos', pagos);
})();
