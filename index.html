        nmb(r.futuro?r.egrP:r.egrR), r.futuro?'—':nmb(r.finR), nmb(r.finP), r.futuro?'Proyectado':'Real']),
      'Saldo actual '+$$(saldoHoy())+'  ·  proyectado a fin de mes '+$$(saldoProyFinMes())); }
};

/* ═══════════════════════════════════════════════════════════════════
   9 · EVENTOS
   ═══════════════════════════════════════════════════════════════════ */
function reRender(foco){
  render();
  if(foco){ const el = $(foco); if(el){ el.focus();
    try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
}
document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-acc],[data-cerrar],[data-sec],[data-ir],[data-pac],[data-trat],[data-tid],'+
    '[data-wa],[data-hecho],[data-nuevo-turno],[data-nuevo-turno-pac],[data-bloquear],[data-agv],[data-agnav],'+
    '[data-dia],[data-mes],[data-volver-pac],[data-volver-trat],[data-nuevo-pac],[data-edit-pac],[data-anamnesis],'+
    '[data-neces],[data-proponer],[data-hc-print],[data-hc-pdf],[data-cons-print],[data-cons-firmar],[data-cons-nuevo],'+
    '[data-cons-pend],[data-nuevo-trat],[data-edit-trat],[data-reg-sesion],[data-agendar-trat],[data-pausar],'+
    '[data-fintab],[data-cobrar],[data-pagar],[data-nuevo-ing],[data-nuevo-egr],[data-servtab],[data-stocktab],'+
    '[data-nuevo-prov],[data-edit-prov],[data-compra-prov],[data-nueva-compra],[data-nuevo-prod],[data-edit-prod],'+
    '[data-ajuste],[data-permes],[data-asis],[data-marcar-asis],[data-nuevo-pago],[data-pagar-sueldo],[data-recibo],'+
    '[data-edit-emp],[data-nuevo-serv],[data-edit-serv],[data-regla],[data-sugerencia],[data-cfg-clinica],'+
    '[data-cfg-horario],[data-wapac],[data-wasaludo],[data-exp-pac],[data-exp-agenda],[data-exp-trat],[data-exp-fin],'+
    '[data-exp-prov],[data-exp-stock],[data-exp-per],[data-exp-serv],[data-res-excel],[data-inf-pdf],'+
    '[data-flujo-excel],[data-flujo-pdf],[data-cons-pdf],[data-cons-edit],[data-foto-add],[data-foto-del],'+
    '[data-lupa],[data-mov-edit],[data-regla-nueva],[data-regla-del],[data-neces-nueva],[data-neces-del],'+
    '[data-serv-del],[data-recibo-pdf],[data-salir]');
  if(!el) return;
  const d = el.dataset;
  if(el.tagName==='A') ev.preventDefault();

  /* Modal */
  if(d.acc!==undefined){ const a = _mAcciones[+d.acc]; if(a&&a.fn) a.fn(); return; }
  if(d.cerrar!==undefined){ cerrarModal(); return; }

  /* Navegación */
  if(d.sec){ ir(d.sec, {pacienteId:null, tratamientoId:null}); return; }
  if(d.ir){ ir(d.ir, {pacienteId:null, tratamientoId:null}); return; }
  if(d.pac){ ir('pacientes', {pacienteId:d.pac, tratamientoId:null}); return; }
  if(d.trat){ ir('tratamientos', {tratamientoId:d.trat, pacienteId:null}); return; }
  if(d.volverPac!==undefined){ ST.pacienteId=null; render(); return; }
  if(d.volverTrat!==undefined){ ST.tratamientoId=null; render(); return; }

  /* Agenda */
  if(d.agv){ ST.agVista=d.agv; render(); return; }
  if(d.agnav!==undefined){ const n=+d.agnav;
    if(n===0) ST.agFecha=HOY_ISO;
    else if(ST.agVista==='dia') ST.agFecha=addD(ST.agFecha,n);
    else if(ST.agVista==='semana') ST.agFecha=addD(ST.agFecha,7*n);
    else if(ST.agVista==='mes') ST.agFecha=addM(ST.agFecha,n);
    else ST.agFecha=addM(ST.agFecha,12*n);
    render(); return; }
  if(d.dia){ ST.agFecha=d.dia; ST.agVista='dia'; ir('agenda'); return; }
  if(d.mes){ ST.agFecha=d.mes+'-01'; ST.agVista='mes'; render(); return; }
  if(d.wa){ waRecordatorio(STORE.get('turnos', d.wa)); return; }
  if(d.hecho){ modalRealizado(d.hecho); return; }
  if(d.tid){ modalTurno(d.tid); return; }
  if(d.nuevoTurno!==undefined){ modalTurno(null); return; }
  if(d.nuevoTurnoPac){ modalTurno(null, {pacienteId:d.nuevoTurnoPac}); return; }
  if(d.bloquear!==undefined){ modalBloqueo(); return; }

  /* Pacientes */
  if(d.nuevoPac!==undefined){ modalPaciente(null); return; }
  if(d.editPac){ modalPaciente(d.editPac); return; }
  if(d.anamnesis){ modalAnamnesis(d.anamnesis); return; }
  if(d.neces){ modalNecesidades(d.neces); return; }
  if(d.hcPrint){ imprimirHC(d.hcPrint); return; }
  if(d.hcPdf){ pdfHC(d.hcPdf); return; }
  if(d.wapac){ const p=pac(d.wapac);
    window.open('https://wa.me/'+p.tel.replace(/[^0-9]/g,''),'_blank'); return; }
  if(d.wasaludo){ const p=pac(d.wasaludo);
    window.open('https://wa.me/'+p.tel.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(
      '¡Feliz cumpleaños, '+p.nombre.split(' ')[0]+'! 🤍 Te esperamos en ALMAS con un mimo especial este mes. — '+CONFIG.clinica.profesional),'_blank'); return; }
  if(d.proponer){ const [pid,sid]=d.proponer.split('|'); modalTratamiento(null, pid, sid); return; }

  /* Cerrar sesión */
  if(d.salir!==undefined){ cerrarSesion(); return; }

  /* Fotos de evolución */
  if(d.fotoAdd){ modalFoto(d.fotoAdd); return; }
  if(d.lupa){ verFoto(ST.pacienteId, d.lupa); return; }
  if(d.fotoDel){ const [pid,fid] = d.fotoDel.split('|');
    confirmar('Eliminar foto','¿Sacamos esta foto de la ficha? No se puede deshacer.',()=>{
      const p = pac(pid);
      STORE.editar('pacientes', pid, {fotos:(p.fotos||[]).filter(f=>f.id!==fid)});
      toast('Foto eliminada','warn'); render(); },'Eliminar','btn--d'); return; }

  /* Consentimientos */
  if(d.consPdf){ pdfConsentimiento(d.consPdf); return; }
  if(d.consEdit){ modalConsentimiento(null, d.consEdit); return; }
  if(d.consPrint){ imprimirConsentimiento(d.consPrint); return; }
  if(d.consFirmar){ STORE.editar('consentimientos', d.consFirmar, {estado:'Firmado', fecha:HOY_ISO});
    toast('Consentimiento marcado como firmado','ok'); render(); return; }
  if(d.consNuevo){ modalConsentimiento(d.consNuevo); return; }
  if(d.consPend!==undefined){ const l = consPendientes();
    modal({ titulo:'Consentimientos pendientes de firma', cuerpo: l.length?`<div class="lista">${l.map(c=>`
      <div class="item"><span class="oro">${IC.firma}</span>
        <div class="item__c"><b>${esc(pacN(c.pacienteId))}</b><span>${esc(c.tipo)}${c.tratamientoId?' · '+esc(svcN((STORE.get('tratamientos',c.tratamientoId)||{}).servicioId)):''}</span></div>
        <button class="btn btn--sm btn--p" data-cons-pdf="${c.id}" title="PDF para firmar">${IC.baja}</button>
        <button class="btn btn--sm" data-cons-print="${c.id}" title="Imprimir">${IC.print}</button>
        <button class="btn btn--sm btn--g" data-cons-firmar="${c.id}" title="Marcar como firmado">${IC.check}</button></div>`).join('')}</div>`
      : vacio('No hay consentimientos pendientes','check'), acciones:[{txt:'Cerrar', fn:cerrarModal}] }); return; }

  /* Tratamientos */
  if(d.nuevoTrat!==undefined){ modalTratamiento(null, d.nuevoTrat||null); return; }
  if(d.editTrat){ modalTratamiento(d.editTrat); return; }
  if(d.regSesion){ modalSesion(d.regSesion); return; }
  if(d.agendarTrat){ const t=STORE.get('tratamientos',d.agendarTrat), pc=proxControl(t);
    modalTurno(null, {pacienteId:t.pacienteId, servicioId:t.servicioId, fecha:pc?pc.fecha:HOY_ISO,
      dur:svc(t.servicioId).dur, precio:t.modo==='paquete'?0:t.precioSesion});
    ST._tratPre = t.id; return; }
  if(d.pausar){ const t=STORE.get('tratamientos',d.pausar);
    STORE.editar('tratamientos', d.pausar, {estado: t.estado==='Pausado'?'En curso':'Pausado'});
    toast(t.estado==='Pausado'?'Tratamiento reanudado':'Tratamiento pausado','ok'); render(); return; }

  /* Finanzas */
  if(d.fintab){ ST.finTab=d.fintab; render(); return; }
  if(d.cobrar){ STORE.editar('movimientos', d.cobrar, {estado:'Cobrado', fecha:HOY_ISO});
    toast('Cobro registrado','ok'); render(); return; }
  if(d.pagar){ STORE.editar('movimientos', d.pagar, {estado:'Pagado'});
    toast('Pago registrado','ok'); render(); return; }
  if(d.movEdit){ const m = STORE.get('movimientos', d.movEdit); if(m) modalMovimiento(m.tipo, m.id); return; }
  if(d.nuevoIng!==undefined){ modalMovimiento('ingreso'); return; }
  if(d.nuevoEgr!==undefined){ modalMovimiento('egreso'); return; }

  /* Proveedores y stock */
  if(d.nuevoProv!==undefined){ modalProveedor(null); return; }
  if(d.editProv){ modalProveedor(d.editProv); return; }
  if(d.compraProv){ modalCompra(d.compraProv); return; }
  if(d.nuevaCompra!==undefined){ modalCompra(null); return; }
  if(d.stocktab){ ST.stockTab=d.stocktab; render(); return; }
  if(d.nuevoProd!==undefined){ modalProducto(null); return; }
  if(d.editProd){ modalProducto(d.editProd); return; }
  if(d.ajuste){ modalAjuste(d.ajuste); return; }

  /* Personal */
  if(d.permes!==undefined){ ST.perMes = mesK(addM(ST.perMes+'-01', +d.permes)); render(); return; }
  if(d.asis){ modalAsistencia(d.asis); return; }
  if(d.marcarAsis!==undefined){ modalAsistencia(HOY_ISO); return; }
  if(d.nuevoPago!==undefined){ modalPago(null); return; }
  if(d.pagarSueldo){ modalPago(d.pagarSueldo); return; }
  if(d.recibo){ imprimirRecibo(d.recibo); return; }
  if(d.reciboPdf){ pdfRecibo(d.reciboPdf); return; }
  if(d.editEmp){ modalEmpleado(d.editEmp); return; }

  /* Servicios y reglas */
  if(d.servtab){ ST.servTab=d.servtab; render(); return; }
  if(d.nuevoServ!==undefined){ modalServicio(null); return; }
  if(d.editServ){ modalServicio(d.editServ); return; }
  if(d.reglaNueva!==undefined){ modalRegla(-1); return; }
  if(d.reglaDel!==undefined){ const r = CONFIG.reglasContra[+d.reglaDel];
    confirmar('Eliminar regla','Se deja de avisar por <b>'+esc(r.label)+'</b> al agendar y al proponer tratamientos. ¿Confirmás?',()=>{
      CONFIG.reglasContra.splice(+d.reglaDel,1); toast('Regla eliminada','warn'); render(); },'Eliminar','btn--d'); return; }
  if(d.regla!==undefined){ modalRegla(+d.regla); return; }
  if(d.necesNueva!==undefined){ modalSugerencia(null); return; }
  if(d.necesDel){ const n = d.necesDel;
    confirmar('Eliminar necesidad','Se quita <b>'+esc(n)+'</b> de la lista y de las fichas que la tengan. ¿Confirmás?',()=>{
      delete CONFIG.reglasSugerencia[n];
      CONFIG.necesidades = CONFIG.necesidades.filter(x=>x!==n);
      STORE.list('pacientes').forEach(p=>{ if((p.necesidades||[]).some(x=>x.nombre===n))
        STORE.editar('pacientes', p.id, {necesidades:p.necesidades.filter(x=>x.nombre!==n)}); });
      toast('Necesidad eliminada','warn'); render(); },'Eliminar','btn--d'); return; }
  if(d.sugerencia){ modalSugerencia(d.sugerencia); return; }
  if(d.servDel){ borrarServicio(d.servDel); return; }
  if(d.cfgClinica!==undefined){ modalConfigClinica(); return; }
  if(d.cfgHorario!==undefined){ modalConfigHorario(); return; }

  /* Exportación */
  if(d.expPac!==undefined) return EXPORTS.pacientes();
  if(d.expAgenda!==undefined) return EXPORTS.agenda();
  if(d.expTrat!==undefined) return EXPORTS.tratamientos();
  if(d.expFin!==undefined) return (ST.finTab==='flujo'?EXPORTS.flujoExcel():ST.finTab==='resultados'?EXPORTS.resultadosExcel():EXPORTS.finanzas());
  if(d.expProv!==undefined) return EXPORTS.proveedores();
  if(d.expStock!==undefined) return EXPORTS.stock();
  if(d.expPer!==undefined) return EXPORTS.personal();
  if(d.expServ!==undefined) return EXPORTS.servicios();
  if(d.resExcel!==undefined) return EXPORTS.resultadosExcel();
  if(d.infPdf!==undefined) return EXPORTS.informePDF();
  if(d.flujoExcel!==undefined) return EXPORTS.flujoExcel();
  if(d.flujoPdf!==undefined) return EXPORTS.flujoPDF();
});

/* Filtros (selects y buscadores) */
document.addEventListener('change', function(ev){
  const t = ev.target, d = t.dataset;
  if(d.fp){ ST.filtros.pac[d.fp]=t.value; render(); }
  else if(d.fh){ ST.filtros.hc[d.fh]=t.value; render(); }
  else if(d.ft){ ST.filtros.tr[d.ft]=t.value; render(); }
  else if(d.ff){ ST.filtros.fin[d.ff]=t.value; render(); }
  else if(d.fr){ ST.filtros.res[d.fr]=t.value; render(); }
});
let _tBusca;
document.addEventListener('input', function(ev){
  const t = ev.target, d = t.dataset;
  if(!(d.fp==='q'||d.ft==='q'||d.ff==='q')) return;
  clearTimeout(_tBusca);
  const sel = d.fp?'[data-fp="q"]':d.ft?'[data-ft="q"]':'[data-ff="q"]';
  const val = t.value;
  _tBusca = setTimeout(()=>{
    if(d.fp) ST.filtros.pac.q=val; else if(d.ft) ST.filtros.tr.q=val; else ST.filtros.fin.q=val;
    reRender(sel);
  }, 260);
});
/* Menú lateral en celular */
$('#burger').addEventListener('click', ()=>{ $('#nav').classList.toggle('on'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', ()=>{ $('#nav').classList.remove('on'); $('#scrim').classList.remove('on'); });
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if($('#lightbox').classList.contains('on')){ $('#lightbox').classList.remove('on'); return; }
  if($('#modal').classList.contains('on')) cerrarModal();
});

/* ═══════════════════════════════════════════════════════════════════
   10 · ARRANQUE Y PANTALLA DE BLOQUEO
   ═══════════════════════════════════════════════════════════════════ */
function saludo(){ const h = new Date().getHours();
  return h<12 ? 'Buen día' : h<20 ? 'Buenas tardes' : 'Buenas noches'; }

/** LOGIN REAL (segunda etapa):
 *  Reemplazar esta función por Firebase Authentication, por ejemplo:
 *    import {getAuth, signInWithEmailAndPassword, onAuthStateChanged} from 'firebase/auth';
 *    signInWithEmailAndPassword(auth, email, clave).then(abrirApp).catch(errorClave);
 *    onAuthStateChanged(auth, u => u && abrirApp());
 *  Con usuarios separados para la doctora (acceso total) y la asistente
 *  (sin Finanzas ni Personal) se resuelve también el modo administrador. */
function validarClave(v){ return v === CONFIG.PASSWORD; }

function abrirApp(){
  $('#lock').classList.add('off');
  setTimeout(()=>{ $('#lock').style.display='none'; }, 560);
  $('#app').classList.add('on');
  pintarNav(); render();
}

(function arranque(){
  /* Logos */
  $('#lockLogo').innerHTML = LOGO_ALMAS.conFallback('completo');
  $('#lockMono').innerHTML = LOGO_ALMAS.monograma();
  $('#navLogo').innerHTML  = LOGO_ALMAS.horizontal();
  $('#lockWydan').innerHTML = LOGO_WYDAN;
  $('#navWydan').innerHTML  = LOGO_WYDAN;
  $('#lockSaludo').textContent = saludo()+', '+CONFIG.clinica.profesional.split(' ').slice(0,2).join(' ');
  /* Favicon con el monograma */
  const fav = document.createElement('link'); fav.rel='icon';
  fav.href = 'data:image/svg+xml,'+encodeURIComponent(LOGO_ALMAS.monograma());
  document.head.appendChild(fav);

  $('#icSalir').innerHTML = IC.salir;

  /* Presentación de Wydan: es lo primero que se ve al abrir el link */
  pintarBienvenida();
  mostrarBienvenida();
  $('#bvEntrar').addEventListener('click', entrarDemo);
  $('#lockVolver').addEventListener('click', mostrarBienvenida);
  $('#lightbox').addEventListener('click', ()=>$('#lightbox').classList.remove('on'));

  /* Desbloqueo */
  const card = $('#lockCard'), inp = $('#lockPass'), err = $('#lockErr');
  card.addEventListener('submit', e=>{
    e.preventDefault();
    if(validarClave(inp.value)){ err.textContent=''; abrirApp(); }
    else { err.textContent = 'Contraseña incorrecta. Probá de nuevo.';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      inp.value=''; inp.focus(); }
  });
  /* el foco se pone al entrar desde la presentación, no al cargar */

  /* La capa de datos avisa cuando algo cambia (así se enchufa onSnapshot) */
  STORE.alCambiar(()=>{ pintarNav(); });

  console.log('%cALMAS · Gestión clínica','font:600 15px Cinzel,serif;color:#B8955B');
  console.log('Datos de demo:', STORE.list('pacientes').length,'pacientes ·',
    STORE.list('turnos').length,'turnos ·', STORE.list('tratamientos').length,'tratamientos ·',
    STORE.list('movimientos').length,'movimientos financieros.');
})();
</script>
