/* ── Listas de opciones con búsqueda ─────────────────────────────
   Todas las listas desplegables de la herramienta salen de sel().
   No usamos <select> ni <datalist>: en el celular no se despliegan
   bien y el toque no selecciona (misma decisión que en el resto de
   nuestras páginas). Esta la armamos nosotros:
     · tocás el campo o la flechita y se abren todas las opciones
     · mientras escribís, se van filtrando
     · se elige con el dedo, con el mouse o con las flechas + Enter
     · se abre hacia arriba si abajo no hay lugar (teclado del celular)
     · sigue al campo cuando la página se mueve al abrirse el teclado
   El valor real (id) viaja en un input oculto con data-n, así que
   leer() y los filtros siguen funcionando igual que con un <select>. */
let _comboN = 0;
const COMBOS = {};

function sel(n, ops, v, extra){
  const id = 'cb'+(++_comboN);
  const lista = (ops||[]).map(o=>{
    const val = (o && o.v!==undefined) ? o.v : o;
    const tx  = (o && o.t!==undefined) ? o.t : o;
    return { v:String(val==null?'':val), t:String(tx==null?'':tx) };
  });
  COMBOS[id] = lista;
  const act = lista.find(o=>o.v===String(v==null?'':v));
  return `<div class="combo" data-cb="${id}">
    <input class="inp combo__inp" type="text" autocomplete="off" spellcheck="false" role="combobox"
      value="${esc(act?act.t:'')}" placeholder="Elegir o escribir para buscar…">
    <span class="combo__fl">${IC.abajo}</span>
    <input type="hidden" data-n="${n}" value="${esc(act?act.v:(v==null?'':v))}" ${extra||''}>
  </div>`;
}

(function listaDeOpciones(){
  let pop=null, campo=null, marcada=-1, todas=false;

  const caja    = c => c ? c.closest('.combo') : null;
  const opts    = c => (caja(c) && COMBOS[caja(c).dataset.cb]) || [];
  const oculto  = c => caja(c) && caja(c).querySelector('input[type="hidden"]');
  const etiqueta= c => { const h=oculto(c); const o=opts(c).find(x=>x.v===h.value); return o?o.t:''; };

  function crearPop(){
    if(pop) return pop;
    pop = document.createElement('div');
    pop.className = 'lista-pop';
    /* Con el mouse: que el campo no pierda el foco al hacer clic en una opción. */
    pop.addEventListener('mousedown', e=>{ if(e.target.closest('.lista-op')) e.preventDefault(); });
    /* Con el dedo: se elige al levantarlo y solo si no arrastraste
       (si no, al deslizar la lista se elegía la opción de abajo del dedo). */
    let apoyo = null;
    pop.addEventListener('pointerdown', e=>{ const b=e.target.closest('.lista-op'); apoyo = b?{x:e.clientX,y:e.clientY,op:b}:null; });
    pop.addEventListener('pointerup', e=>{
      if(!apoyo) return; const a=apoyo; apoyo=null;
      const arrastro = Math.abs(e.clientX-a.x)>8 || Math.abs(e.clientY-a.y)>8;
      if(!arrastro && e.target.closest('.lista-op')===a.op) elegir(a.op.dataset.v);
    });
    pop.addEventListener('pointercancel', ()=>{ apoyo=null; });
    document.body.appendChild(pop);
    return pop;
  }

  function pintar(){
    if(!campo) return;
    const todo = opts(campo);
    const q = todas ? '' : (campo.value||'').trim().toLowerCase();
    /* Primero las que empiezan igual, después las que lo contienen. */
    const empiezan=[], contienen=[];
    todo.forEach(o=>{
      const l = o.t.toLowerCase();
      if(!q || l.indexOf(q)===0) empiezan.push(o);
      else if(l.indexOf(q)>=0) contienen.push(o);
    });
    const res = empiezan.concat(contienen);
    marcada = -1;
    const actual = oculto(campo).value;
    crearPop().innerHTML = res.length
      ? res.map((o,i)=>`<button type="button" class="lista-op ${o.v===actual?'on':''}" data-v="${esc(o.v)}" data-i="${i}">${esc(o.t)}</button>`).join('')
      : `<div class="lista-vacia">Sin resultados para «${esc(campo.value.trim())}»</div>`;
    if(res.length) marcada = res.findIndex(o=>o.v===actual);
    ubicar();
  }

  /* Debajo del campo; si abajo no entra (teclado del celular), arriba. */
  function ubicar(){
    if(!pop || !campo) return;
    const guardado = pop.scrollTop;
    const r = campo.getBoundingClientRect();
    const vv = window.visualViewport, altoVista = vv?vv.height:window.innerHeight;
    if(!pop.classList.contains('abierto')){ pop.style.visibility='hidden'; pop.style.display='block'; pop.style.maxHeight=''; }
    const alto = Math.min(pop.scrollHeight, 300);
    const abajo = altoVista - r.bottom, arriba = r.top;
    const haciaArriba = (abajo < alto+12 && arriba > abajo);
    pop.style.maxHeight = Math.max(96, Math.min(alto, (haciaArriba?arriba:abajo)-12))+'px';
    pop.style.width = Math.max(r.width, 190)+'px';
    const anchoVista = vv?vv.width:window.innerWidth;
    pop.style.left = Math.max(8, Math.min(r.left, anchoVista - Math.max(r.width,190) - 8))+'px';
    pop.style.top = (haciaArriba ? (r.top - pop.offsetHeight - 4) : (r.bottom + 4))+'px';
    pop.style.visibility='';
    pop.classList.add('abierto');
    if(caja(campo)) caja(campo).classList.add('abierto');
    pop.scrollTop = guardado;
    const m = pop.querySelector('.lista-op.on'); if(m) m.scrollIntoView({block:'nearest'});
  }

  function abrir(input){
    if(campo===input && pop && pop.classList.contains('abierto')) return;
    cerrar();
    campo = input; todas = true;
    input.select();
    pintar();
  }
  /* Al cerrar se repone la etiqueta de la opción elegida: la lista es
     cerrada (el valor es un id), así que no puede quedar texto suelto. */
  function cerrar(){
    if(campo){ campo.value = etiqueta(campo); if(caja(campo)) caja(campo).classList.remove('abierto'); }
    if(pop){ pop.classList.remove('abierto'); pop.style.display=''; }
    campo = null; marcada = -1;
  }
  function elegir(v){
    if(!campo) return;
    const c = campo, h = oculto(c);
    h.value = v;
    c.value = etiqueta(c);
    cerrar();
    h.dispatchEvent(new Event('input', {bubbles:true}));
    h.dispatchEvent(new Event('change', {bubbles:true}));
  }
  function marcar(d){
    if(!pop) return;
    const ops = pop.querySelectorAll('.lista-op'); if(!ops.length) return;
    marcada = (marcada + d + ops.length + (marcada<0 && d<0 ? 1 : 0)) % ops.length;
    ops.forEach((o,i)=>o.classList.toggle('on', i===marcada));
    if(ops[marcada]) ops[marcada].scrollIntoView({block:'nearest'});
  }

  document.addEventListener('focusin', e=>{
    const i = e.target.closest && e.target.closest('.combo__inp');
    if(i) abrir(i);
    else if(!e.target.closest || !e.target.closest('.lista-pop')) cerrar();
  });
  document.addEventListener('input', e=>{ if(campo && e.target===campo){ todas=false; pintar(); } });
  /* Tocar el campo cuando ya tiene el foco vuelve a abrir la lista completa (la flechita). */
  document.addEventListener('pointerup', e=>{
    const i = e.target.closest && e.target.closest('.combo');
    if(i && campo && caja(campo)===i && (!pop || !pop.classList.contains('abierto'))){ todas=true; pintar(); }
  });
  document.addEventListener('keydown', e=>{
    if(!campo) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); marcar(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); marcar(-1); }
    else if(e.key==='Enter'){ const o = pop && pop.querySelectorAll('.lista-op')[marcada];
      if(o){ e.preventDefault(); elegir(o.dataset.v); } }
    else if(e.key==='Escape'){ e.stopPropagation(); cerrar(); }
    else if(e.key==='Tab'){ cerrar(); }
  });
  document.addEventListener('pointerdown', e=>{
    if(e.target.closest && (e.target.closest('.lista-pop') || e.target.closest('.combo'))) return;
    cerrar();
  });
  /* El teclado del celular mueve la página: la lista sigue al campo
     en vez de cerrarse, y solo se cierra si el campo salió de pantalla. */
  function seguir(){
    if(!campo || !pop || !pop.classList.contains('abierto')) return;
    const r = campo.getBoundingClientRect();
    const vv = window.visualViewport, alto = vv?vv.height:window.innerHeight;
    if(r.bottom < 0 || r.top > alto){ cerrar(); return; }
    ubicar();
  }
  window.addEventListener('scroll', e=>{
    if(pop && (e.target===pop || (e.target.closest && e.target.closest('.lista-pop')))) return;
    seguir();
  }, true);
  window.addEventListener('resize', seguir);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', seguir);
    window.visualViewport.addEventListener('scroll', seguir);
  }
  /* Cada vez que se redibuja una sección, las listas viejas ya no existen. */
  window.cerrarListas = cerrar;
})();

const chk = (n,l,v) => `<label class="chk ${v?'on':''}"><input type="checkbox" data-n="${n}" ${v?'checked':''}><span>${esc(l)}</span></label>`;
/** Lee todos los campos [data-n] de un contenedor */
function leer(root){
  const o = {};
  root.querySelectorAll('[data-n]').forEach(e=>{
    const n = e.dataset.n;
    if(e.type==='checkbox'){ o[n] = e.checked; }
    else if(e.multiple){ o[n] = Array.prototype.slice.call(e.selectedOptions).map(x=>x.value); }
    else o[n] = e.type==='number' ? (e.value===''?null:+e.value) : e.value;
  });
  return o;
}

/* Gráficos SVG (sin librerías) ----------------------------------- */
function chartIngEgr(serie){
  if(!serie.length) return vacio('Sin datos');
  const W=940,H=300,ml=62,mr=14,mt=16,mb=38;
  const max = Math.max.apply(null, serie.map(d=>Math.max(d.ing,d.egr)).concat([1]));
  const esc1 = v => H-mb-(v/max)*(H-mt-mb);
  const iw = (W-ml-mr)/serie.length, bw = Math.min(16, iw*0.32);
  let g = '';
  for(let i=0;i<=4;i++){ const y = mt+(H-mt-mb)*i/4, v = max*(1-i/4);
    g += `<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="#E7DFD2" stroke-width="1"/>
          <text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#9A8C7C">${$k(v)}</text>`; }
  serie.forEach((d,i)=>{
    const x = ml+iw*i+iw/2;
    g += `<rect x="${x-bw-1}" y="${esc1(d.ing)}" width="${bw}" height="${Math.max(1,H-mb-esc1(d.ing))}" rx="3" fill="url(#gOro)"/>
          <rect x="${x+1}" y="${esc1(d.egr)}" width="${bw}" height="${Math.max(1,H-mb-esc1(d.egr))}" rx="3" fill="#C4694F" opacity=".72"/>`;
    if(serie.length<=14 || i%2===0)
      g += `<text x="${x}" y="${H-mb+16}" text-anchor="middle" font-size="9.5" fill="#9A8C7C">${esc(mesNom3(d.k))}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="gOro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4B57E"/><stop offset="100%" stop-color="#B8955B"/></linearGradient></defs>
    ${g}<line x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}" stroke="#D8CCB9" stroke-width="1.2"/>
  </svg></div>
  <div class="leg"><span><i style="background:#C2A067"></i>Ingresos</span><span><i style="background:#C4694F"></i>Egresos</span></div>`;
}
function chartLinea(serie, campo1, etiqueta, campo2, etiqueta2){
  if(!serie.length) return vacio('Sin datos');
  const W=940,H=260,ml=66,mr=16,mt=16,mb=34;
  const vals = serie.map(d=>d[campo1]).concat(campo2?serie.map(d=>d[campo2]):[]);
  const max = Math.max.apply(null, vals.concat([1])), min = Math.min.apply(null, vals.concat([0]));
  const rg = (max-min)||1;
  const px = i => ml+(W-ml-mr)*(serie.length===1?0.5:i/(serie.length-1));
  const py = v => H-mb-((v-min)/rg)*(H-mt-mb);
  let g='';
  for(let i=0;i<=4;i++){ const y=mt+(H-mt-mb)*i/4, v=max-(rg*i/4);
    g+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="#E7DFD2"/>
        <text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#9A8C7C">${$k(v)}</text>`; }
  if(min<0){ const y0=py(0); g+=`<line x1="${ml}" y1="${y0}" x2="${W-mr}" y2="${y0}" stroke="#C4694F" stroke-dasharray="4 3"/>`; }
  const linea = (cmp,color,fill) => {
    const pts = serie.map((d,i)=>px(i)+','+py(d[cmp])).join(' ');
    let s = fill ? `<polygon points="${ml},${H-mb} ${pts} ${px(serie.length-1)},${H-mb}" fill="${color}" opacity=".10"/>` : '';
    s += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += serie.map((d,i)=>`<circle cx="${px(i)}" cy="${py(d[cmp])}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('');
    return s; };
  if(campo2) g += linea(campo2, '#9A8C7C', false);
  g += linea(campo1, '#B8955B', true);
  serie.forEach((d,i)=>{ if(serie.length<=14||i%2===0)
    g+=`<text x="${px(i)}" y="${H-mb+16}" text-anchor="middle" font-size="9.5" fill="#9A8C7C">${esc(mesNom3(d.k))}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg></div>

/* ---------- salida 1: HTML para imprimir ---------- */
const encDoc = (titulo, sub) => `<div class="doc__head"><div class="doc__logo">${LOGO_ALMAS.horizontal()}</div>
  <div><h1>${esc(titulo)}</h1><p style="margin:4px 0 0;color:#666">${esc(sub||'')}</p>

const pieDoc = () => `<div class="doc__pie"><span>ALMAS — ${esc(CONFIG.clinica.profesional)}</span>
  <span>Emitido el ${fF(HOY_ISO,'largo')}</span><span>Desarrollado por Wydan Solutions</span></div>`;

function docHTML(def){
  const b = def.bloques.map(x=>{
    if(x.h) return `<h2>${esc(x.h)}</h2>`;
    if(x.p) return `<p${x.chico?' style="font-size:10px"':''}>${esc(x.p)}</p>`;
    if(x.aviso) return `<p style="font-size:9px;color:#777;margin-top:12px">${esc(x.aviso)}</p>`;
    if(x.kv) return `<table>${x.kv.map(f=>`<tr>${f.map((c,i)=>
        i%2===0 ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    if(x.tabla) return `<table><tr>${x.tabla.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`
      + x.tabla.body.map(f=>`<tr>${f.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('') + `</table>`;
    if(x.firmas) return `<div class="doc__firmas">${x.firmas.map(f=>
        `<div class="doc__firma">${esc(f[0])}<br>${esc(f[1]||'')}</div>`).join('')}</div>`;
    return '';
  }).join('');
  return `<div class="doc">${encDoc(def.titulo, def.sub)}${b}${pieDoc()}</div>`;
}

/* ---------- salida 2: PDF descargable ---------- */
function docPDF(def){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('La descarga en PDF necesita conexión a internet','warn'); return; }
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:'mm', format:'a4'});
  const M = 16, W = 210, H = 297, AN = W - M*2;
  let y = M + 2;
  const hojaNueva = alto => { if(y + alto > H - 20){ d.addPage(); y = M + 6; } };

  /* Encabezado de marca */
  d.setFont('times','normal'); d.setFontSize(21); d.setTextColor(184,149,91);
  d.text('A L M A S', M, y+6);
  d.setFont('helvetica','normal'); d.setFontSize(7.6); d.setTextColor(150,136,120);
  d.text(CONFIG.clinica.profesional+'  ·  '+CONFIG.clinica.subtitulo, M, y+11);
  d.text(CONFIG.clinica.dir+'  ·  '+CONFIG.clinica.tel+'  ·  '+CONFIG.clinica.email, M, y+14.8);
  d.setFont('helvetica','bold'); d.setFontSize(12.5); d.setTextColor(59,49,41);
  d.text(def.titulo.toUpperCase(), W-M, y+6, {align:'right'});
  if(def.sub){ d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(110,100,90);
    d.text(String(def.sub), W-M, y+11.4, {align:'right'}); }
  y += 19;
  d.setDrawColor(184,149,91); d.setLineWidth(.7); d.line(M, y, W-M, y); y += 8;

  const tabla = (head, body, estilos) => {
    d.autoTable(Object.assign({
      head: head?[head]:undefined, body, startY:y, margin:{left:M, right:M},
      styles:{fontSize:8.2, cellPadding:2, textColor:[40,34,28], lineColor:[225,219,208], lineWidth:.1},
      headStyles:{fillColor:[184,149,91], textColor:255, fontSize:7.8, fontStyle:'bold'},
      alternateRowStyles:{fillColor:[250,247,241]}, theme:'grid'
    }, estilos||{}));
    y = d.lastAutoTable.finalY + 6;
  };

  def.bloques.forEach(x=>{
    if(x.h){ hojaNueva(16);
      d.setFont('helvetica','bold'); d.setFontSize(9.6); d.setTextColor(59,49,41);
      d.text(String(x.h).toUpperCase(), M, y);
      d.setDrawColor(222,214,200); d.setLineWidth(.3); d.line(M, y+1.8, W-M, y+1.8);
      y += 7; return; }
    if(x.p || x.aviso){
      const chico = x.chico || x.aviso;
      d.setFont('helvetica', x.aviso?'italic':'normal'); d.setFontSize(chico?8:9.2);
      d.setTextColor(x.aviso?130:50, x.aviso?120:44, x.aviso?110:38);
      const ls = d.splitTextToSize(String(x.p||x.aviso), AN);
      hojaNueva(ls.length*4.4 + 3);
      d.text(ls, M, y); y += ls.length*(chico?3.9:4.6) + 2.6; return; }
    if(x.kv){ hojaNueva(14);
      tabla(null, x.kv, { columnStyles:{0:{fontStyle:'bold',fillColor:[246,241,232],cellWidth:33},
        2:{fontStyle:'bold',fillColor:[246,241,232],cellWidth:33}}, alternateRowStyles:{} }); return; }
    if(x.tabla){ hojaNueva(20); tabla(x.tabla.head, x.tabla.body, x.tabla.anchos?{columnStyles:x.tabla.anchos}:null); return; }
    if(x.firmas){
      hojaNueva(34); y += 16;
      const ancho = (AN - 16) / x.firmas.length;
      x.firmas.forEach((f,i)=>{
        const x0 = M + i*(ancho+16), cx = x0 + ancho/2;
        d.setDrawColor(70,62,54); d.setLineWidth(.35); d.line(x0, y, x0+ancho, y);
        d.setFont('helvetica','normal'); d.setFontSize(8.2); d.setTextColor(60,52,45);
        d.text(String(f[0]), cx, y+4.6, {align:'center'});
        if(f[1]){ d.setFontSize(7.4); d.setTextColor(120,110,100); d.text(String(f[1]), cx, y+8.8, {align:'center'}); }
      });
      y += 14; return; }
  });

  /* Pie en todas las hojas */
  const hojas = d.internal.getNumberOfPages();
  for(let i=1;i<=hojas;i++){
    d.setPage(i);
    d.setDrawColor(230,224,214); d.setLineWidth(.3); d.line(M, H-14, W-M, H-14);
    d.setFont('helvetica','normal'); d.setFontSize(7); d.setTextColor(160,150,138);
    d.text('ALMAS — '+CONFIG.clinica.profesional, M, H-10);
    d.text('Emitido el '+fF(HOY_ISO,'largo'), W/2, H-10, {align:'center'});
    d.text('Hoja '+i+' de '+hojas+'  ·  Desarrollado por Wydan Solutions', W-M, H-10, {align:'right'});
  }
  d.save('ALMAS - '+def.archivo+'.pdf');
  toast('PDF descargado','ok');
}

/* ---------- imprimir ----------
   Se abre el documento en una pestaña aparte y se manda a imprimir desde
   ahí: es lo único que funciona igual en la computadora, en el celular y
   dentro de una página incrustada. Si el navegador bloquea la pestaña,
   se imprime la propia página (CSS de impresión) y, si tampoco se puede,
   se avisa y queda el botón de PDF.                                      */
function imprimirDoc(def){
  const html = docHTML(def);
  const estilos = document.querySelector('style') ? document.querySelector('style').textContent : '';
  const completo = `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
    <title>${esc(def.titulo)} — ALMAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>${estilos}
      body{background:#fff;margin:0;padding:18mm 14mm}
      #printArea{display:block}
      @media print{ body{padding:0} }
    </style></head><body><div id="printArea">${html}</div>
    <script>window.addEventListener('load',function(){ setTimeout(function(){ window.focus(); window.print(); }, 350); });<\/script>
    </body></html>`;
  let v = null;
  try { v = window.open('', '_blank'); } catch(e){ v = null; }
  if(v && v.document){
    v.document.open(); v.document.write(completo); v.document.close();
    toast('Documento abierto para imprimir','ok');
    return;
  }
  /* Plan B: imprimir esta misma página con el CSS de impresión */
  try{
    $('#printArea').innerHTML = html;
    setTimeout(()=>{ try{ window.print(); }catch(e){
      toast('El navegador no deja imprimir acá: usá «Descargar PDF»','warn'); } }, 80);
  }catch(e){ toast('No se pudo abrir la impresión: usá «Descargar PDF»','warn'); }
}

function resumenMes(k){

    ingCobrado:suma(ing.filter(x=>x.estado==='Cobrado')),
    ingPendiente:suma(ing.filter(x=>x.estado!=='Cobrado')),
    egrPagado:suma(egr.filter(x=>x.estado==='Pagado')),
    egrPendiente:suma(egr.filter(x=>x.estado!=='Pagado')),
    sesiones: STORE.list('turnos', t=>mesK(t.fecha)===k && t.estado==='Realizado').length
  };
}
/** Flujo de caja mensual: real y proyectado (incluye meses futuros) */
function flujoCaja(futuros){
  const base = mesesConDatos(); if(!base.length) return [];
  const fin = mesK(addM(K_HOY+'-01', futuros===undefined?6:futuros));
  const meses=[]; let k=base[0];
  while(k<=fin){ meses.push(k); k=mesK(addM(k+'-01',1)); }
  /* Base de proyección: promedio de los últimos 3 meses cerrados.
     Los egresos futuros se arman con los gastos que se repiten todos los meses
     (alquiler, sueldo, BPS, servicios) más el promedio de insumos y compras. */
  const cerrados = meses.filter(x=>x<K_HOY).slice(-3).map(resumenMes);
  const nC = cerrados.length || 1;
  const pIng = cerrados.reduce((a,b)=>a+b.ingCobrado,0)/nC;
  const CAT_FIJAS = ['Alquiler','Sueldos','BPS / DGI','Servicios públicos','Limpieza y bioseguridad',
                     'Marketing y redes','Honorarios profesionales'];
  const promCat = c => cerrados.reduce((a,b)=>
    a + suma(STORE.list('movimientos', m=>m.tipo==='egreso' && m.categoria===c && mesK(m.fecha)===b.k)), 0)/nC;
  const pFijos = CAT_FIJAS.reduce((a,c)=>a+promCat(c), 0);
  const pVar   = ['Insumos de cabina','Productos para venta','Mantenimiento y calibración de equipos']
    .reduce((a,c)=>a+promCat(c), 0);
  /* Estacionalidad: cómo se comportó ese mismo mes el año pasado */
  const anioPrev = {}; meses.filter(x=>x.slice(0,4)===String(HOY.getFullYear()-1)).forEach(x=>anioPrev[x.slice(5)]=resumenMes(x).ingTotal);
  const mediaPrev = Object.values(anioPrev).reduce((a,b)=>a+b,0)/(Object.keys(anioPrev).length||1);
  const estacional = mk => (mediaPrev && anioPrev[mk.slice(5)]) ? Math.min(1.25, Math.max(.8, anioPrev[mk.slice(5)]/mediaPrev)) : 1;

  let sr = SALDO_INICIAL, sp = SALDO_INICIAL;
  return meses.map(mk=>{
    const r = resumenMes(mk), futuro = mk > K_HOY;
    const ingR = futuro?0:r.ingCobrado, egrR = futuro?0:r.egrPagado;
    /* turnos ya agendados en ese mes futuro: lo que ya está vendido */
    const agendado = futuro ? suma(STORE.list('turnos', t=>mesK(t.fecha)===mk &&
      ['Pendiente','Confirmado'].includes(t.estado)).map(t=>({monto:t.precio}))) : 0;
    const ingP = futuro ? (r.ingPendiente + Math.max(agendado, pIng*estacional(mk)*0.94)) : r.ingTotal;
    const egrP = futuro ? (r.egrPendiente + pFijos + pVar) : (r.egrPagado + r.egrPendiente);
    const o = { k:mk, iniR:sr, ingR, egrR, finR: sr+ingR-egrR,
                iniP:sp, ingP, egrP, finP: sp+ingP-egrP, futuro, sesiones:r.sesiones };
    /* Los meses cerrados vuelven a anclar la proyección en la caja real:
       así "proyectado" siempre significa "lo real de hoy + lo que falta cobrar y pagar". */
    sr = o.finR; sp = (mk < K_HOY) ? o.finR : o.finP; return o;
  });
}
const saldoHoy = () => { const f = flujoCaja(0).filter(x=>!x.futuro); return f.length ? f[f.length-1].finR : SALDO_INICIAL; };
const saldoProyFinMes = () => { const f = flujoCaja(0).find(x=>x.k===K_HOY); return f ? f.finP : saldoHoy(); };

/** Última visita de un paciente */
function ultimaVisita(pid){
  const t = STORE.list('turnos', x=>x.pacienteId===pid && x.estado==='Realizado').sort((a,b)=>a.fecha<b.fecha?1:-1);
  return t.length ? t[0].fecha : null;
}
function pacientesInactivos(){
  return STORE.list('pacientes', p=>{
    const u = ultimaVisita(p.id);
    return u ? difD(u, HOY_ISO) > CONFIG.diasInactividad : difD(p.alta, HOY_ISO) > CONFIG.diasInactividad;
  });
}
function cumplesSemana(){
  const out=[];
  STORE.list('pacientes').forEach(p=>{
    if(!p.nac) return;
    for(let d=0; d<7; d++){ const f = addD(HOY_ISO,d);
      if(f.slice(5)===p.nac.slice(5)){ out.push({p, fecha:f}); break; } }
  });
  return out.sort((a,b)=>a.fecha<b.fecha?-1:1);
}
function valoracionesSinPlan(){
  return STORE.list('turnos', t=>t.servicioId==='sv29' && t.estado==='Realizado' && difD(t.fecha,HOY_ISO)<=50 && difD(t.fecha,HOY_ISO)>=0)
    .filter(t=> !STORE.list('tratamientos', x=>x.pacienteId===t.pacienteId && x.inicio>=t.fecha).length)
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
}

  const fin = t.hora ? (()=>{ const m = +t.hora.slice(0,2)*60 + +t.hora.slice(3) + (t.dur||30);

    <div class="turno__a">

      ${bdg(t.estado)}
      ${['Pendiente','Confirmado'].includes(t.estado)?`<button class="btn btn--sm btn--wa" data-wa="${t.id}" title="Recordar por WhatsApp">${IC.wa}</button>`:''}
      ${['Pendiente','Confirmado'].includes(t.estado)?`<button class="btn btn--sm btn--g" data-hecho="${t.id}">Realizado</button>`:''}
    </div></div>`;
}

        ${kpi('Ticket promedio', rm.sesiones?$$(rm.ingTotal/rm.sesiones):'—','','','grafico')}
      </div>
      <div class="cal">${DOW3.slice(1).concat(DOW3[0]).map(d=>`<div class="cal__dow">${d}</div>`).join('')}${celdas}</div>`;
  }
  else {
    const a = +f.slice(0,4); titulo = 'Año '+a;
    let tot=0;
    const minis = MESES.map((mn,mi)=>{
      const k = a+'-'+z2(mi+1), dias = finMes(k), off=(dt(k+'-01').getDay()+6)%7;
      let n=0, cel='';
      for(let i=0;i<off;i++) cel += `<div class="mesmini__d"></div>`;
      for(let d=1;d<=dias;d++){ const fd=k+'-'+z2(d), c=turnosDe(fd).length; n+=c;
        cel += `<div class="mesmini__d ${c>=6?'has3':c>=3?'has2':c?'has':''} ${fd===HOY_ISO?'hoy':''}">${d}</div>`; }
      tot += n;
      return `<div class="mesmini" data-mes="${k}"><h4>${mn}</h4><div class="mesmini__g">${cel}</div>
        <div class="mesmini__f">${n} turnos</div></div>`;
    }).join('');
    cuerpo = `<div class="kpis mb14">
        ${kpi('Turnos del año', tot,'','','agenda')}
        ${kpi('Sesiones realizadas', STORE.list('turnos', t=>t.fecha.slice(0,4)===String(a)&&t.estado==='Realizado').length,'','ok','check')}
        ${kpi('Facturado', $$(suma(ingresosDe(m=>m.fecha.slice(0,4)===String(a)))),'','','plata')}
        ${kpi('Pacientes atendidos', new Set(STORE.list('turnos', t=>t.fecha.slice(0,4)===String(a)&&t.estado==='Realizado').map(t=>t.pacienteId)).size,'','','pacientes')}
      </div><div class="anio">${minis}</div>`;
  }

  return `<div class="flex ac wrap g10 mb14">
      <div class="segm">${[['dia','Día'],['semana','Semana'],['mes','Mes'],['anio','Año']].map(x=>
        `<button class="${v===x[0]?'on':''}" data-agv="${x[0]}">${x[1]}</button>`).join('')}</div>
      <div class="flex ac g6">
        <button class="btn btn--ic" data-agnav="-1">${IC.izq}</button>
        <button class="btn btn--sm" data-agnav="0">Hoy</button>
        <button class="btn btn--ic" data-agnav="1">${IC.der}</button>
      </div>
      <div class="tit tit-l sp" style="min-width:200px">${esc(titulo)}</div>
    </div>${cuerpo}`;
};

            <div class="fs12">${esc(ci.motivos.map(m=>m.texto).join(' · '))}. Se pedirá confirmación antes de guardar.</div></div></div>`;

            <div class="alertas__t">Realizar con precaución</div><div class="fs12">${esc(ci.motivos.map(m=>m.texto).join(' · '))}</div></div></div>`;

function guardarTurno(t){
  const body = $('#mBody'), v = leer(body);
  if(!v.pacienteId) return toast('Elegí un paciente','warn');
  const p = pac(v.pacienteId), s = svc(v.servicioId);
  if(faltaValoracion(p.id, s)) return toast('Falta la consulta de valoración previa','bad');
  const ci = contraindicacion(p, s);
  const sol = solapa(v.fecha, v.hora, v.dur, v.prof, t?t.id:null);

  const grabar = () => {
    if(t){ STORE.editar('turnos', t.id, v); toast('Turno actualizado','ok'); }
    else { STORE.crear('turnos', Object.assign({tratamientoId:(ST._tratPre||null), sesion:null, bloqueo:false}, v));
           toast('Turno agendado','ok'); ST._tratPre=null; }
    cerrarModal(); render();
  };
  const pasoSolape = () => {
    if(!sol) return grabar();
    cerrarModal();
    confirmar('Horario ocupado',
      `${esc(sol.prof)} ya tiene un turno a las ${sol.hora} (${esc(sol.bloqueo?'bloqueo':pacN(sol.pacienteId))}).<br>¿Querés agendar igual?`,
      grabar, 'Agendar igual', 'btn--p');
  };
  if(ci.nivel==='bloquea'){
    const cuerpo = `<div class="alertas mb14"><span class="alertas__ic">${IC.alerta}</span><div>
      <div class="alertas__t">Contraindicación activa</div>
      <div class="fs12">${esc(svcN(s.id))} está contraindicado para ${esc(p.nombre)}: <b>${esc(ci.motivos.map(m=>m.texto).join(' · '))}</b>.</div></div></div>
      <p class="fs13">Solo la profesional puede decidir avanzar. ¿Confirmás el turno bajo tu criterio médico?</p>`;
    modal({ titulo:'Confirmar bajo criterio médico', ancho:'chico', cuerpo,
      acciones:[{txt:'No agendar', fn:cerrarModal}, {txt:'Agendar igual', cls:'btn--d', fn:pasoSolape}] });
    return;
  }
  pasoSolape();
}

function listaPacientes(){
  const f = ST.filtros.pac = Object.assign({q:'', estado:'', alerta:'', fototipo:''}, ST.filtros.pac);

  let lista = STORE.list('pacientes').filter(p=>{
    if(q && !(p.nombre.toLowerCase().includes(q) || p.ci.includes(q) || p.tel.replace(/\s/g,'').includes(q.replace(/\s/g,'')))) return false;

    ${sel('_a',[{v:'',t:'Con y sin alertas'},{v:'si',t:'Solo con alertas'}], f.alerta, 'data-fp="alerta"')}
    ${sel('_f',[{v:'',t:'Todos los fototipos'}].concat(CONFIG.fototipos.map(x=>({v:x,t:'Fototipo '+x}))), f.fototipo, 'data-fp="fototipo"')}

        <td class="nowrap">${uv?fF(uv,'corto'):'—'} ${inact?bdg('Inactivo','neutro'):''}</td>

/* ── FICHA = HISTORIA CLÍNICA ──────────────────────────────────── */
function fichaPaciente(pid){
  const p = pac(pid); if(!p) return vacio('Paciente no encontrado');
  const al = alertasPaciente(p), a = p.anamnesis;
  const vis = visitasDe(pid).sort((x,y)=>x.fecha<y.fecha?1:-1);
  const trats = tratsDe(pid), activos = trats.filter(t=>t.estado!=='Finalizado');
  const cons = STORE.list('consentimientos', c=>c.pacienteId===pid);
  const sug = sugerencias(p);
  const hf = ST.filtros.hc = Object.assign({servicio:'', anio:''}, ST.filtros.hc);
  const anios = Array.from(new Set(vis.map(t=>t.fecha.slice(0,4)))).sort().reverse();
  const servs = Array.from(new Set(vis.map(t=>t.servicioId)));
  const visF = vis.filter(t=>(!hf.servicio||t.servicioId===hf.servicio) && (!hf.anio||t.fecha.slice(0,4)===hf.anio));
  const prox = activos.map(proxControl).filter(Boolean).sort((x,y)=>x.fecha<y.fecha?-1:1)[0];

  const si = v => v?'<b class="rojo">Sí</b>':'<span class="muted-2">No</span>';

  return `
  <div class="card mb14"><div class="card__b">
    <div class="ficha__top">
      ${avatar(p.nombre)}
      <div style="flex:1;min-width:200px">
        <h2 class="tit tit-xl">${esc(p.nombre)}</h2>
        <div class="muted fs12 mt6">${edad(p.nac)} años · CI ${esc(p.ci)} · ${esc(p.tel)} · ${esc(p.email)}</div>
        <div class="muted-2 fs11">${esc(p.dir)} · alta ${fF(p.alta,'largo')} · nos conoció por ${esc(p.origen)}</div>
      </div>
      <div class="btnrow">
        <button class="btn btn--sm btn--wa" data-wapac="${p.id}">${IC.wa}WhatsApp</button>
        <button class="btn btn--sm" data-edit-pac="${p.id}">${IC.edit}Editar datos</button>
      </div>
    </div>
    ${al.length ? `<div class="alertas mt14"><span class="alertas__ic">${IC.alerta}</span><div style="flex:1">
        <div class="alertas__t">Alertas · leer antes de cada sesión</div>
        <div class="alertas__c">${al.map(x=>bdg(x.t, x.n==='bloquea'?'bad':'warn')).join('')}</div></div></div>`
      : `<div class="alertas alertas--ok mt14"><span class="alertas__ic">${IC.check}</span>
         <div class="fs13">Sin alergias ni contraindicaciones registradas.</div></div>`}
  </div></div>

  <div class="kpis mb14">
    ${kpi('Visitas', vis.length, vis.length?('desde '+fF(vis[vis.length-1].fecha,'corto')):'—','','check')}
    ${kpi('Total invertido', $$(invertidoDe(pid)), 'histórico cobrado','','plata')}

/* ── Fotos de evolución ──────────────────────────────────────────
   Las fotos de un celular pesan varios MB: se achican antes de
   guardarlas para que la herramienta siga liviana.                 */
function achicarImagen(file, maxLado, calidad){
  return new Promise((ok, err)=>{
    const fr = new FileReader();
    fr.onerror = ()=>err(new Error('No se pudo leer la foto'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>err(new Error('El archivo no es una imagen'));
      img.onload = ()=>{
        const e = Math.min(1, maxLado/Math.max(img.width, img.height));
        const w = Math.round(img.width*e), h = Math.round(img.height*e);
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        ok(cv.toDataURL('image/jpeg', calidad||0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      <div class="hint">Las fotos se achican solas antes de guardarse. Quedan en esta sesión;
      con la nube contratada se guardan junto a la historia clínica.</div>`,
    acciones:[{txt:'Cancelar', fn:cerrarModal},
      {txt:'Guardar fotos', cls:'btn--p', ic:'check', fn:()=>{
        const v = leer($('#mBody'));
        if(!_fotosCargadas.length) return toast('Todavía no elegiste ninguna foto','warn');
        const actuales = (p.fotos||[]).slice();
        _fotosCargadas.forEach((src,i)=>actuales.push({
          id:'fo'+Date.now()+i, src, fecha:v.fecha||HOY_ISO, etiqueta:v.etiqueta, nota:v.nota||'' }));
        STORE.editar('pacientes', pid, {fotos:actuales});
        cerrarModal(); toast(_fotosCargadas.length+' foto'+(_fotosCargadas.length>1?'s':'')+' agregada'+(_fotosCargadas.length>1?'s':''),'ok');
        _fotosCargadas = []; render();
      }}],
    alMontar(body){
      _fotosCargadas = [];
      const drop = body.querySelector('#fzDrop'), inp = body.querySelector('#fzInput'), prev = body.querySelector('#fzPrevia');
      const procesar = async files => {
        const lista = Array.prototype.slice.call(files).filter(f=>/^image\//.test(f.type));
        if(!lista.length) return toast('Elegí archivos de imagen','warn');
        for(const f of lista){
          try{ _fotosCargadas.push(await achicarImagen(f, 1100, .72)); }
          catch(e){ toast('No se pudo leer «'+f.name+'»','bad'); }
        }
        prev.innerHTML = _fotosCargadas.map((src,i)=>
          `<figure class="foto"><img src="${src}" alt="Vista previa">
           <button class="foto__x" data-quitar="${i}" title="Quitar">${IC.equis}</button></figure>`).join('');
      };
      drop.addEventListener('click', ()=>inp.click());
      inp.addEventListener('change', e=>procesar(e.target.files));
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('sobre'); }));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('sobre'); }));
      drop.addEventListener('drop', e=>procesar(e.dataTransfer.files));
      prev.addEventListener('click', e=>{
        const b = e.target.closest('[data-quitar]'); if(!b) return;
        _fotosCargadas.splice(+b.dataset.quitar, 1);
        prev.innerHTML = _fotosCargadas.map((src,i)=>
          `<figure class="foto"><img src="${src}" alt="Vista previa">
           <button class="foto__x" data-quitar="${i}" title="Quitar">${IC.equis}</button></figure>`).join('');
      });
    } });
}

    precioPaquete: Math.round(sBase.precio*sBase.sesiones*0.85/100)*100, cuotas:3, estado:'En curso', obs:'' };
  modal({ titulo: t?'Editar tratamiento':'Nuevo tratamiento', ancho:'ancho',
    cuerpo:`
      <div class="grid g2">
        ${campo('Paciente', sel('pacienteId',[{v:'',t:'— Elegir —'}].concat(pacOpts()), d.pacienteId))}
        ${campo('Servicio', sel('servicioId', svcOpts().filter(o=>o.v!=='sv29'), d.servicioId))}

      <div class="grid g4 mt10">

        ${campo('Frecuencia (días)', inN('frec', d.frec,'min="1"'))}
        ${campo('Fecha de inicio', inF('inicio', d.inicio))}
      </div>
      <div class="grid g4">

        ${campo('Precio por sesión', inN('precioSesion', d.precioSesion))}
        ${campo('Precio del paquete', inN('precioPaquete', d.precioPaquete))}
        ${campo('Cantidad de cuotas', inN('cuotas', d.cuotas,'min="1" max="12"'))}
      </div>
      ${campo('Observaciones', inA('obs', d.obs))}
      ${t?'':`<label class="chk on"><input type="checkbox" data-n="_agendar" checked><span>Agendar la primera sesión en la fecha de inicio</span></label>`}`,
    acciones:[{txt:'Cancelar', fn:cerrarModal},{txt:'Guardar', cls:'btn--p', ic:'check', fn:()=>{
      const v = leer($('#mBody'));
      if(!v.pacienteId) return toast('Elegí un paciente','warn');
      const p = pac(v.pacienteId), s = svc(v.servicioId);
      if(faltaValoracion(p.id,s)) return toast('Este servicio necesita una consulta de valoración previa','bad');
      const guardar = ()=>{
        if(t){ STORE.editar('tratamientos', tid, v); toast('Tratamiento actualizado','ok'); }
        else {
          const nt = STORE.crear('tratamientos', Object.assign({}, v));
          if(v._agendar){
            const hora = '10:00';
            STORE.crear('turnos', { fecha:v.inicio, hora, dur:s.dur, pacienteId:p.id, servicioId:s.id,
              prof: s.cat==='Médico'||s.cat==='Láser'?CONFIG.profesionales[0]:CONFIG.profesionales[1],
              estado:'Confirmado', precio: v.modo==='paquete'?0:v.precioSesion, nota:'Sesión 1 del plan',
              tratamientoId:nt.id, sesion:null, bloqueo:false });
          }
          if(v.modo==='paquete'){
            const cu = Math.round(v.precioPaquete/v.cuotas/10)*10;
            for(let i=0;i<v.cuotas;i++) STORE.crear('movimientos', { fecha:addD(v.inicio,i*30), tipo:'ingreso',
              categoria:s.cat, concepto:'Plan '+svcN(s.id)+' — cuota '+(i+1)+'/'+v.cuotas, pacienteId:p.id,
              proveedorId:null, monto:cu, medio:'Transferencia', estado: i===0?'Cobrado':'Pendiente',
              proyectado:false, vinculo:'Tratamiento', tratamientoId:nt.id, nota:'' });
          }
          /* consentimiento automático según el tipo de procedimiento */
          if(s.tags.some(x=>['laser','prp','invasivo','dermapen'].includes(x)))
            STORE.crear('consentimientos', { pacienteId:p.id, tratamientoId:nt.id,
              tipo: s.tags.includes('prp')?'PRP' : s.tags.includes('dermapen')?'Dermapen'
                  : (s.tags.includes('invasivo')&&!s.tags.includes('laser'))?'Lesiones cutáneas':'Láser',
              fecha:'', estado:'Pendiente' });
          ST.tratamientoId = nt.id; toast('Tratamiento creado','ok');
        }
        cerrarModal(); render();
      };
      const ci = contraindicacion(p,s);
      if(ci.nivel==='bloquea'){ modal({ titulo:'Contraindicación', ancho:'chico',
        cuerpo:`<div class="alertas"><span class="alertas__ic">${IC.alerta}</span><div class="fs12">
          <b>${esc(svcN(s.id))}</b> está contraindicado para ${esc(p.nombre)}: ${esc(ci.motivos.map(m=>m.texto).join(' · '))}.</div></div>
          <p class="fs13 mt10">¿Creás el plan igual, bajo criterio médico?</p>`,
        acciones:[{txt:'No crear', fn:cerrarModal},{txt:'Crear igual', cls:'btn--d', fn:guardar}] }); return; }
      guardar();
    }}],
    alMontar(body){
      const refrescar = ()=>{
        const v = leer(body), s = svc(v.servicioId), p = v.pacienteId?pac(v.pacienteId):null;
        if(body.dataset.sv !== v.servicioId){
          body.querySelector('[data-n="zona"]').value = s.zona;
          body.querySelector('[data-n="sesionesTot"]').value = s.sesiones;
          body.querySelector('[data-n="frec"]').value = s.frec;
          body.querySelector('[data-n="precioSesion"]').value = s.precio;
          body.querySelector('[data-n="precioPaquete"]').value = Math.round(s.precio*s.sesiones*0.85/100)*100;
          body.dataset.sv = v.servicioId;
        }
        let h='';
        if(p){ const ci = contraindicacion(p,s);
          if(faltaValoracion(p.id,s)) h += `<div class="alertas mt10"><span class="alertas__ic">${IC.alerta}</span>
            <div class="fs12"><b>Falta la consulta de valoración.</b> Este servicio no se puede planificar sin ella.</div></div>`;
          if(ci.nivel) h += `<div class="alertas ${ci.nivel==='precaucion'?'alertas--warn':''} mt10"><span class="alertas__ic">${IC.alerta}</span>
            <div class="fs12"><b>${ci.nivel==='bloquea'?'Contraindicado':'Con precaución'}:</b> ${esc(ci.motivos.map(m=>m.texto).join(' · '))}</div></div>`;
          const al = alertasPaciente(p);
          if(al.length) h += `<div class="alertas alertas--warn mt10"><span class="alertas__ic">${IC.alerta}</span><div style="flex:1">
            <div class="alertas__t">Historia clínica</div><div class="alertas__c">${al.map(a=>bdg(a.t,a.n==='bloquea'?'bad':'warn')).join('')}</div></div></div>`;
        }
        body.querySelector('#trAlertas').innerHTML = h;
      };
      body.addEventListener('change', refrescar); refrescar();
    } });
}

/* ── Registrar una sesión del plan (sin pasar por la agenda) ───── */
function modalSesion(tid){
  const t = STORE.get('tratamientos', tid), s = svc(t.servicioId), p = pac(t.pacienteId);
  const n = sesionesDe(tid).length+1;
  const pr = paramsDe(s), claves = Object.keys(pr);
  const porPaquete = t.modo==='paquete';
  modal({ titulo:'Registrar sesión '+n+' de '+t.sesionesTot, ancho:'ancho',
    cuerpo:`<div class="alertas alertas--info mb14"><span class="alertas__ic">${IC.trat}</span>
        <div><div class="fs13 b6">${esc(p.nombre)} — ${esc(svcN(s.id))}</div>
        <div class="fs12 muted">Plan de ${t.sesionesTot} sesiones cada ${t.frec} días</div></div></div>
      <div class="grid g3">
        ${campo('Fecha', inF('fecha', HOY_ISO))}
        ${campo('Hora', inH('hora','10:00'))}
        ${campo('Profesional', sel('prof', CONFIG.profesionales, s.cat==='Médico'?CONFIG.profesionales[0]:CONFIG.profesionales[0]))}
      </div>
      <div class="eyebrow mb6">Parámetros del equipo</div>
      <div class="grid g4">${claves.map((c,i)=>campo(c, inT('p'+i, pr[c]))).join('')}</div>
      <div class="grid g2">
        ${campo('Reacción inmediata', sel('reaccion', REACCIONES, REACCIONES[0]))}
        ${campo('Zona tratada', inT('zona', t.zona))}
      </div>
      ${campo('Nota de evolución', inA('nota','', 'Qué se observó, qué se ajusta para la próxima'))}
      <div class="hr"></div>
      ${porPaquete ? `<div class="alertas alertas--info"><span class="alertas__ic">${IC.info}</span>
          <div class="fs12">Sesión incluida en el paquete. No se genera cobro.</div></div><input type="hidden" data-n="monto" value="0">`
        : `<div class="grid g3">${campo('Monto a cobrar', inN('monto', t.precioSesion))}
           ${campo('Medio de pago', sel('medio', CONFIG.mediosPago,'Efectivo'))}
           ${campo('Estado del cobro', sel('cobroEstado',['Cobrado','Pendiente'],'Cobrado'))}</div>`}
      <label class="chk on"><input type="checkbox" data-n="_prox" checked>
        <span>Agendar la próxima sesión dentro de ${t.frec} días</span></label>`,
    acciones:[{txt:'Cancelar', fn:cerrarModal},{txt:'Guardar sesión', cls:'btn--p', ic:'check', fn:()=>{
      const v = leer($('#mBody'));
      const params = {}; claves.forEach((c,i)=>{ if(v['p'+i]) params[c]=v['p'+i]; });
      const tu = STORE.crear('turnos', { fecha:v.fecha, hora:v.hora, dur:s.dur, pacienteId:p.id, servicioId:s.id,
        prof:v.prof, estado:'Realizado', precio: porPaquete?0:(v.monto||0), nota:'', tratamientoId:tid, bloqueo:false,
        sesion:{ n, params, reaccion:v.reaccion, nota:v.nota||'', indic:s.post } });
      if(!porPaquete && v.monto)
        STORE.crear('movimientos', { fecha:v.fecha, tipo:'ingreso', categoria:s.cat, concepto:svcN(s.id),
          pacienteId:p.id, proveedorId:null, monto:v.monto, medio:v.medio, estado:v.cobroEstado,
          proyectado:false, vinculo:'Turno', turnoId:tu.id, fechaCobro:v.cobroEstado==='Pendiente'?addD(v.fecha,15):'', nota:'' });
      if(n >= t.sesionesTot) STORE.editar('tratamientos', tid, {estado:'Finalizado'});
      else if(v._prox){
        let f = addD(v.fecha, t.frec); while(!esLaboral(f)) f = addD(f,1);
        STORE.crear('turnos', { fecha:f, hora:v.hora, dur:s.dur, pacienteId:p.id, servicioId:s.id, prof:v.prof,
          estado:'Pendiente', precio: porPaquete?0:t.precioSesion, nota:'Sesión '+(n+1)+' del plan',
          tratamientoId:tid, sesion:null, bloqueo:false });
      }
      cerrarModal(); toast('Sesión '+n+' registrada','ok'); render();
    }}] });
}

/* ═══════════════════════════════════════════════════════════════════
   7 · SECCIÓN · FINANZAS  (Ingresos · Egresos · Resultados · Flujo)
   ═══════════════════════════════════════════════════════════════════ */
const CAT_ING = ['Láser','Facial','Corporal','Médico','Consulta','Productos'];
const aniosDisponibles = () => Array.from(new Set(STORE.list('movimientos').map(m=>m.fecha.slice(0,4)))).sort().reverse();

ACCIONES.finanzas = () => `
  <button class="btn btn--sm" data-exp-fin>${IC.baja}Exportar</button>
  ${ST.finTab==='egresos' ? `<button class="btn btn--sm btn--p" data-nuevo-egr>${IC.mas}Registrar gasto</button>`
    : ST.finTab==='ingresos' ? `<button class="btn btn--sm btn--p" data-nuevo-ing>${IC.mas}Registrar ingreso</button>`
    : `<button class="btn btn--sm btn--p" data-inf-pdf>${IC.print}Informe PDF</button>`}`;

VISTAS.finanzas = function(){
  const tabs = [['ingresos','Ingresos'],['egresos','Egresos'],['resultados','Resultados'],['flujo','Flujo de caja']];
  return `<div class="tabs">${tabs.map(t=>`<button class="tab ${ST.finTab===t[0]?'on':''}" data-fintab="${t[0]}">${t[1]}</button>`).join('')}</div>`
    + ({ingresos:finIngresos, egresos:finEgresos, resultados:finResultados, flujo:finFlujo}[ST.finTab]||finIngresos)();
};

function filtrosFin(tipo){
  const f = ST.filtros.fin = Object.assign({anio:String(HOY.getFullYear()), mes:z2(HOY.getMonth()+1), estado:'', cat:'', medio:'', q:''}, ST.filtros.fin);
  const cats = tipo==='ingreso' ? CAT_ING : CONFIG.catEgresos;
  const estados = tipo==='ingreso' ? ['Cobrado','Pendiente','Vencido'] : ['Pagado','Pendiente'];
  return {f, html:`<div class="filtros">
    <div class="buscador">${IC.lupa}<input class="inp" placeholder="Buscar concepto…" data-ff="q" value="${esc(f.q)}"></div>
    ${sel('_a',[{v:'',t:'Todos los años'}].concat(aniosDisponibles().map(a=>({v:a,t:a}))), f.anio,'data-ff="anio"')}
    ${sel('_m',[{v:'',t:'Todos los meses'}].concat(MESES.map((m,i)=>({v:z2(i+1),t:m.replace(/^./,c=>c.toUpperCase())}))), f.mes,'data-ff="mes"')}
    ${sel('_e',[{v:'',t:'Todos los estados'}].concat(estados.map(e=>({v:e,t:e}))), f.estado,'data-ff="estado"')}
    ${sel('_c',[{v:'',t:'Todas las categorías'}].concat(cats.map(c=>({v:c,t:c}))), f.cat,'data-ff="cat"')}
    ${tipo==='ingreso'?sel('_p',[{v:'',t:'Todos los medios'}].concat(CONFIG.mediosPago.map(x=>({v:x,t:x}))), f.medio,'data-ff="medio"'):''}
  </div>`};
}
function aplicarFiltroFin(tipo){
  const f = ST.filtros.fin, q = (f.q||'').toLowerCase();
  return STORE.list('movimientos', m=> m.tipo===tipo
    && (!f.anio || m.fecha.slice(0,4)===f.anio)
    && (!f.mes || m.fecha.slice(5,7)===f.mes)
    && (!f.estado || m.estado===f.estado)
    && (!f.cat || m.categoria===f.cat)
    && (!f.medio || m.medio===f.medio)
    && (!q || m.concepto.toLowerCase().includes(q) || (m.pacienteId&&pacN(m.pacienteId).toLowerCase().includes(q)))
  ).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
}

/* ── INGRESOS ──────────────────────────────────────────────────── */
function finIngresos(){
  const {f, html} = filtrosFin('ingreso');
  const lista = aplicarFiltroFin('ingreso');
  const cob = lista.filter(m=>m.estado==='Cobrado'), pen = lista.filter(m=>m.estado==='Pendiente'), ven = lista.filter(m=>m.estado==='Vencido');
  const porCat = {}; lista.forEach(m=>porCat[m.categoria]=(porCat[m.categoria]||0)+m.monto);
  const hoyMes = resumenMes(K_HOY);
  return `
  <div class="kpis mb14">
    ${kpi('Cobrado (filtro)', $$(suma(cob)), cob.length+' movimientos','ok','plata')}
    ${kpi('Pendiente', $$(suma(pen)), pen.length+' por cobrar', pen.length?'warn':'','reloj')}
    ${kpi('Vencido', $$(suma(ven)), ven.length+' a reclamar', ven.length?'bad':'','alerta')}
    ${kpi('Ticket promedio', cob.length?$$(suma(cob)/cob.length):'—','por movimiento cobrado','','grafico')}
    ${kpi('Este mes', $$(hoyMes.ingCobrado), MESES[+K_HOY.slice(5,7)-1]+' · '+hoyMes.sesiones+' sesiones','','torta')}
  </div>
  ${html}
  <div class="grid g-2-1">
    ${card('Movimientos de ingreso', lista.length ? `<div class="tw"><table class="t">
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Paciente</th><th>Categoría</th><th>Medio</th>
        <th class="num">Monto</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.slice(0,400).map(m=>`<tr>
        <td class="nowrap mono">${fF(m.fecha,'corto')}</td>
        <td><b>${esc(m.concepto)}</b>${m.nota?`<div class="fs11 muted-2">${esc(m.nota)}</div>`:''}</td>
        <td>${m.pacienteId?`<a href="#" data-pac="${m.pacienteId}" style="text-decoration:none;border-bottom:1px solid var(--borde-fuerte)">${esc(pacN(m.pacienteId))}</a>`:'—'}</td>
        <td>${esc(m.categoria)}</td><td class="fs12">${esc(m.medio)}</td>
        <td class="num b6">${$$(m.monto)}</td>
        <td>${bdg(m.estado)}${m.fechaCobro&&m.estado!=='Cobrado'?`<div class="fs11 muted-2 mt6">est. ${fF(m.fechaCobro,'corto')}</div>`:''}</td>
        <td class="right nowrap">${m.estado!=='Cobrado'?`<button class="btn btn--sm btn--g" data-cobrar="${m.id}">${IC.check}Cobrar</button>`:''}<button class="btn btn--sm btn--gh" data-mov-edit="${m.id}" title="Editar o eliminar">${IC.edit}</button></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="5">Total del filtro (${lista.length} movimientos)</td>
        <td class="num">${$$(suma(lista))}</td><td colspan="2"></td></tr></tfoot></table></div>
      ${lista.length>400?`<div class="hint" style="padding:10px 14px">Mostrando los primeros 400.</div>`:''}`
      : vacio('No hay ingresos con esos filtros','plata'),'',true)}

    ${card('Ingresos por categoría', barraH(Object.keys(porCat).sort((a,b)=>porCat[b]-porCat[a])
      .map(c=>({n:c, v:porCat[c]}))) || vacio('Sin datos'))}
  </div>`;
}

/* ── EGRESOS ───────────────────────────────────────────────────── */
function finEgresos(){
  const {f, html} = filtrosFin('egreso');
  const lista = aplicarFiltroFin('egreso');
  const pag = lista.filter(m=>m.estado==='Pagado'), pen = lista.filter(m=>m.estado!=='Pagado');
  const porCat = {}; lista.forEach(m=>porCat[m.categoria]=(porCat[m.categoria]||0)+m.monto);
  return `
  <div class="kpis mb14">
    ${kpi('Pagado (filtro)', $$(suma(pag)), pag.length+' movimientos','','plata')}
    ${kpi('Pendiente de pago', $$(suma(pen)), pen.length+' facturas', pen.length?'warn':'','reloj')}
    ${kpi('Total del período', $$(suma(lista)), lista.length+' egresos','','grafico')}
    ${kpi('Categoría más pesada', Object.keys(porCat).sort((a,b)=>porCat[b]-porCat[a])[0]||'—',
       $$(Math.max.apply(null,Object.values(porCat).concat([0]))),'','torta')}
  </div>
  ${html}
  <div class="grid g-2-1">
    ${card('Movimientos de egreso', lista.length ? `<div class="tw"><table class="t">
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Proveedor</th><th>Categoría</th><th>Medio</th>
        <th class="num">Monto</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.slice(0,400).map(m=>{ const pv = m.proveedorId?STORE.get('proveedores',m.proveedorId):null;

        return `<tr><td class="nowrap mono">${fF(m.fecha,'corto')}</td>
        <td><b>${esc(m.concepto)}</b>${m.nota?`<div class="fs11 muted-2">${esc(m.nota)}</div>`:''}</td>
        <td>${pv?esc(pv.razon):'—'}</td><td>${esc(m.categoria)}</td><td class="fs12">${esc(m.medio)}</td>
        <td class="num b6">${$$(m.monto)}</td>
        <td>${bdg(vencido?'Vencido':m.estado)}${m.vencimiento&&m.estado!=='Pagado'?`<div class="fs11 muted-2 mt6">vence ${fF(m.vencimiento,'corto')}</div>`:''}</td>
        <td class="right nowrap">${m.estado!=='Pagado'?`<button class="btn btn--sm btn--g" data-pagar="${m.id}">${IC.check}Pagar</button>`:''}<button class="btn btn--sm btn--gh" data-mov-edit="${m.id}" title="Editar o eliminar">${IC.edit}</button></td></tr>`; }).join('')}
      </tbody><tfoot><tr><td colspan="5">Total del filtro</td><td class="num">${$$(suma(lista))}</td><td colspan="2"></td></tr></tfoot>
      </table></div>` : vacio('No hay egresos con esos filtros','plata'),'',true)}

    ${card('Egresos por categoría', barraH(Object.keys(porCat).sort((a,b)=>porCat[b]-porCat[a])
      .map(c=>({n:c, v:porCat[c]}))) || vacio('Sin datos'))}
  </div>`;
}

/* ── RESULTADOS ────────────────────────────────────────────────── */
function finResultados(){
  const f = ST.filtros.res = Object.assign({anio:String(HOY.getFullYear())}, ST.filtros.res);
  const todos = mesesConDatos();
  const ult24 = todos.slice(-24);
  const serie = ult24.map(k=>{ const r = resumenMes(k); return {k, ing:r.ingTotal, egr:r.egrTotal}; });
  const delAnio = todos.filter(k=>k.slice(0,4)===f.anio);

  /* tabla mensual del año elegido */
  const filas = delAnio.map(k=>{
    const movs = STORE.list('movimientos', m=>mesK(m.fecha)===k);
    const ing = {}, egr = {};
    movs.forEach(m=>{ const d = m.tipo==='ingreso'?ing:egr; d[m.categoria]=(d[m.categoria]||0)+m.monto; });
    const ti = suma(movs.filter(m=>m.tipo==='ingreso')), te = suma(movs.filter(m=>m.tipo==='egreso'));
    const ses = STORE.list('turnos', t=>mesK(t.fecha)===k && t.estado==='Realizado').length;
    return {k, ing, egr, ti, te, res:ti-te, margen:pct(ti-te,ti), ses, ticket: ses?ti/ses:0};
  });
  const totI = filas.reduce((a,b)=>a+b.ti,0), totE = filas.reduce((a,b)=>a+b.te,0);

  /* comparativos */
  const kAct = K_HOY, kAnt = mesK(addM(kAct+'-01',-1)), kAnioAnt = mesK(addM(kAct+'-01',-12));
  const rA = resumenMes(kAct), rB = resumenMes(kAnt), rC = resumenMes(kAnioAnt);

  /* rankings */
  const porServ = {}, porPac = {};
  STORE.list('movimientos', m=>m.tipo==='ingreso' && m.fecha.slice(0,4)===f.anio).forEach(m=>{
    porServ[m.concepto.split('—')[0].trim()] = (porServ[m.concepto.split('—')[0].trim()]||0)+m.monto;
    if(m.pacienteId) porPac[m.pacienteId] = (porPac[m.pacienteId]||0)+m.monto;
  });
  const topServ = Object.keys(porServ).sort((a,b)=>porServ[b]-porServ[a]).slice(0,8).map(n=>({n, v:porServ[n]}));
  const topPac = Object.keys(porPac).sort((a,b)=>porPac[b]-porPac[a]).slice(0,8).map(id=>({n:pacN(id), v:porPac[id]}));

  const cats = Array.from(new Set(filas.flatMap(r=>Object.keys(r.ing))));
  const catsE = Array.from(new Set(filas.flatMap(r=>Object.keys(r.egr))));

  return `
  <div class="kpis mb14">
    ${kpi('Ingresos '+f.anio, $$(totI), filas.reduce((a,b)=>a+b.ses,0)+' sesiones','ok','plata')}
    ${kpi('Egresos '+f.anio, $$(totE), filas.length+' meses','','grafico')}
    ${kpi('Resultado '+f.anio, $$(totI-totE), 'margen '+pct(totI-totE,totI)+' %', (totI-totE)>0?'ok':'bad','torta')}
    ${kpi('Ticket promedio', filas.reduce((a,b)=>a+b.ses,0)?$$(totI/filas.reduce((a,b)=>a+b.ses,0)):'—','por sesión realizada','','check')}
  </div>

  ${card('Comparativo del mes en curso', `<div class="grid gfit" style="--min:260px">
      <div class="calc"><div class="eyebrow mb6">${esc(mesNom(kAct))} · mes en curso (${dt(HOY_ISO).getDate()} de ${finMes(kAct)} días)</div>
        <div class="calc__l"><span>Ingresos</span><b>${$$(rA.ingTotal)}</b></div>
        <div class="calc__l"><span>Egresos</span><b>${$$(rA.egrTotal)}</b></div>
        <div class="calc__tot"><span>Resultado</span><b class="${rA.ingTotal-rA.egrTotal>=0?'verde':'rojo'}">${$$(rA.ingTotal-rA.egrTotal)}</b></div></div>
      <div class="calc"><div class="eyebrow mb6">vs. ${esc(mesNom(kAnt))}</div>
        <div class="calc__l"><span>Ingresos</span><b>${$$(rB.ingTotal)} ${delta(rA.ingTotal,rB.ingTotal)}</b></div>
        <div class="calc__l"><span>Egresos</span><b>${$$(rB.egrTotal)} ${delta(rA.egrTotal,rB.egrTotal)}</b></div>
        <div class="calc__tot"><span>Resultado</span><b>${$$(rB.ingTotal-rB.egrTotal)}</b></div></div>
      <div class="calc"><div class="eyebrow mb6">vs. ${esc(mesNom(kAnioAnt))}</div>
        <div class="calc__l"><span>Ingresos</span><b>${$$(rC.ingTotal)} ${delta(rA.ingTotal,rC.ingTotal)}</b></div>
        <div class="calc__l"><span>Sesiones</span><b>${rC.sesiones} ${delta(rA.sesiones,rC.sesiones)}</b></div>
        <div class="calc__tot"><span>Resultado</span><b>${$$(rC.ingTotal-rC.egrTotal)}</b></div></div>
    </div>`)}

  <div class="mt14">${card('Ingresos vs. egresos — últimos 24 meses', chartIngEgr(serie))}</div>

  <div class="mt14">${card('Resultado mensual '+f.anio, `
    <div class="filtros">${sel('_ra', aniosDisponibles().map(a=>({v:a,t:'Año '+a})), f.anio,'data-fr="anio"')}</div>
    <div class="tw"><table class="t t--compact">
      <thead><tr><th>Mes</th>${cats.map(c=>`<th class="num">${esc(c)}</th>`).join('')}
        <th class="num">Ingresos</th>${catsE.map(c=>`<th class="num">${esc(c.slice(0,16))}</th>`).join('')}
        <th class="num">Egresos</th><th class="num">Resultado</th><th class="num">Margen</th>
        <th class="num">Ses.</th><th class="num">Ticket</th></tr></thead>
      <tbody>${filas.map(r=>`<tr>
        <td class="b6 nowrap">${esc(MESES[+r.k.slice(5,7)-1])}${r.k===K_HOY?' <span class="muted-2 fs11">(en curso)</span>':''}</td>
        ${cats.map(c=>`<td class="num">${r.ing[c]?nmb(r.ing[c]):'<span class="muted-2">—</span>'}</td>`).join('')}
        <td class="num b6 verde">${nmb(r.ti)}</td>
        ${catsE.map(c=>`<td class="num">${r.egr[c]?nmb(r.egr[c]):'<span class="muted-2">—</span>'}</td>`).join('')}
        <td class="num b6 rojo">${nmb(r.te)}</td>
        <td class="num b7 ${r.res>=0?'verde':'rojo'}">${nmb(r.res)}</td>
        <td class="num">${r.margen} %</td><td class="num">${r.ses}</td><td class="num">${nmb(r.ticket)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td>Total ${f.anio}</td>${cats.map(c=>`<td class="num">${nmb(filas.reduce((a,b)=>a+(b.ing[c]||0),0))}</td>`).join('')}
        <td class="num">${nmb(totI)}</td>${catsE.map(c=>`<td class="num">${nmb(filas.reduce((a,b)=>a+(b.egr[c]||0),0))}</td>`).join('')}
        <td class="num">${nmb(totE)}</td><td class="num">${nmb(totI-totE)}</td><td class="num">${pct(totI-totE,totI)} %</td>
        <td class="num">${filas.reduce((a,b)=>a+b.ses,0)}</td><td></td></tr></tfoot>
    </table></div>
    <div class="hint mt10">Las columnas son las categorías de servicio y los rubros de gasto. Exportá a Excel o PDF para pasárselo al estudio contable.</div>`,
    `<button class="btn btn--sm" data-res-excel>${IC.baja}Excel</button>
     <button class="btn btn--sm" data-inf-pdf>${IC.print}PDF</button>`)}</div>

  <div class="grid g2 mt14">
    ${card('Servicios que más facturan ('+f.anio+')', topServ.length?barraH(topServ):vacio('Sin datos'))}

  return `
  <div class="kpis mb14">

    ${kpi('Proyectado a fin de mes', $$(act?act.finP:0), 'con cobros y pagos pendientes', (act&&act.finP<0)?'bad':'','grafico')}
    ${kpi('Por cobrar', $$(suma(ingresosDe(m=>m.estado!=='Cobrado'))), ingresosDe(m=>m.estado==='Vencido').length+' vencidos','warn','reloj')}
    ${kpi('Por pagar', $$(suma(egresosDe(m=>m.estado!=='Pagado'))), egresosDe(m=>m.estado!=='Pagado').length+' comprobantes','warn','plata')}
  </div>

  ${negativos.length ? `<div class="alertas mb14"><span class="alertas__ic">${IC.alerta}</span><div>
      <div class="alertas__t">Atención al flujo de caja</div>
      <div class="fs12">La proyección queda en negativo en ${negativos.map(r=>mesNom(r.k)).join(', ')}.

    : `<div class="alertas alertas--ok mb14"><span class="alertas__ic">${IC.check}</span>
       <div class="fs12">La proyección de los próximos 6 meses se mantiene positiva.</div></div>`}

  ${card('Evolución del saldo de caja', chartLinea(serie.filter(r=>!r.futuro), 'finR', 'Saldo real'))}

  <div class="mt14">${card('Flujo de caja mensual', `<div class="tw"><table class="t">
    <thead><tr><th>Mes</th><th class="num">Saldo inicial</th><th class="num">Ingresos</th><th class="num">Egresos</th>
      <th class="num">Saldo final</th><th class="num">Proyectado</th><th>Estado</th></tr></thead>
    <tbody>${serie.map(r=>`<tr style="${r.futuro?'opacity:.78':''}">
      <td class="b6 nowrap">${esc(mesNom(r.k))}</td>

      <td class="num verde">${nmb(r.futuro?r.ingP:r.ingR)}</td>
      <td class="num rojo">${nmb(r.futuro?r.egrP:r.egrR)}</td>
      <td class="num b7">${r.futuro?'<span class="muted-2">—</span>':nmb(r.finR)}</td>
      <td class="num ${r.finP<0?'rojo b7':''}">${nmb(r.finP)}</td>
      <td>${r.futuro ? bdg(r.finP<0?'Riesgo':'Proyectado', r.finP<0?'bad':'info') : bdg('Real','ok')}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="hint mt10">Saldo inicial + ingresos − egresos = saldo final, que pasa como saldo inicial del mes siguiente.
    La columna <b>Proyectado</b> suma los cobros pendientes de planes en cuotas y los pagos comprometidos
    (sueldo, BPS, alquiler), y estima el resto con el promedio de los últimos 3 meses cerrados.</div>`,

  const e = STORE.get('personal', empId);

  const c = {P:0,F:0,J:0,M:0,L:0,H:0}; dias.forEach(d=>c[d.estado]=(c[d.estado]||0)+1);
  const valorDia = e.sueldo / CONFIG.rrhh.descuentoFaltaDivisor;
  const descFalta = c.F * valorDia, descMedio = c.M * valorDia/2;
  if(e.modalidad==='Jornalera'){
    const trabajados = c.P + c.M*0.5;
    return { e, c, lineas:[['Jornal', e.jornal],['Días trabajados', trabajados]],
      bruto: e.jornal*trabajados, desc:0, total: e.jornal*trabajados, valorDia:e.jornal };
  }
  return { e, c, valorDia,
    lineas:[['Sueldo nominal', e.sueldo], ['Faltas sin justificar ('+c.F+')', -descFalta],
            ['Medios días ('+c.M+')', -descMedio]],
    bruto:e.sueldo, desc: descFalta+descMedio, total: e.sueldo - descFalta - descMedio };
}
function aguinaldo(empId){
  const hoyMes = +HOY_ISO.slice(5,7);
  const desde = hoyMes>=6 ? HOY_ISO.slice(0,4)+'-06' : addM(HOY_ISO.slice(0,4)+'-01-01',-1).slice(0,7);
  const hasta = K_HOY;
  const pagos = STORE.list('pagos', p=>p.empleadoId===empId && p.concepto==='Sueldo' && p.periodo>=desde && p.periodo<=hasta);
  const bruto = pagos.reduce((a,b)=>a+b.monto,0);
  return { desde, hasta, bruto, monto: bruto/CONFIG.rrhh.aguinaldoDivisor,
    pago: hoyMes>=6&&hoyMes<12 ? HOY_ISO.slice(0,4)+'-12-20' : (hoyMes>=12?(+HOY_ISO.slice(0,4)+1):HOY_ISO.slice(0,4))+'-06-28' };
}
function licencia(empId){
  const e = STORE.get('personal', empId), anio = HOY_ISO.slice(0,4);
  const ini = e.ingreso.slice(0,4)===anio ? e.ingreso : anio+'-01-01';
  const mesesTrab = Math.max(1, Math.round(difD(ini, HOY_ISO)/30.4));
  const generada = Math.round(CONFIG.rrhh.licenciaAnualDias * Math.min(12,mesesTrab)/12);
  const tomada = STORE.list('asistencias', a=>a.empleadoId===empId && a.estado==='L' && a.fecha.slice(0,4)===anio).length;
  const valorDia = e.modalidad==='Jornalera' ? e.jornal : e.sueldo/30;
  return { generada, tomada, pendiente: Math.max(0,generada-tomada), valorDia,
    salarioVac: Math.round(valorDia * generada * 0.7) };
}

/* ── Condiciones de la anamnesis que pueden disparar una regla ──
   Una regla nueva tiene que usar una de estas: son las casillas que
   la doctora marca en la anamnesis. Si se agrega una condición nueva
   hay que sumarla también a condiciones() y a la anamnesis.          */
const CONDICIONES = [
  {v:'embarazo',        t:'Embarazo o lactancia'},
  {v:'isotretinoina',   t:'Isotretinoína (últimos 6 meses)'},
  {v:'marcapasos',      t:'Marcapasos o implante metálico'},
  {v:'bronceado',       t:'Bronceado / autobronceante reciente'},
  {v:'herpes',          t:'Herpes activo o recurrente'},
  {v:'fotosensibles',   t:'Medicación fotosensibilizante'},
  {v:'anticoagulantes', t:'Anticoagulantes'},
  {v:'queloides',       t:'Antecedente de queloides'},
  {v:'epilepsia',       t:'Epilepsia'},
  {v:'diabetes',        t:'Diabetes'},
  {v:'alergiaAnest',    t:'Alergia a anestésicos locales'},
  {v:'fototipoAlto',    t:'Fototipo V–VI'}
];

/* Alta y edición de una regla de contraindicación */
function modalRegla(i){
  const nueva = i < 0;
  const r = nueva ? {cond:'embarazo', label:'', tags:['laser'], nivel:'bloquea'} : CONFIG.reglasContra[i];
  modal({ titulo: nueva ? 'Nueva regla clínica' : 'Regla — '+r.label, ancho:'chico',
    cuerpo:`
      ${campo('Condición de la anamnesis', sel('cond', CONDICIONES, r.cond),
        'Es la casilla que se marca en la ficha del paciente.')}
      ${campo('Cómo se muestra', inT('label', r.label, 'placeholder="Ej. Embarazo o lactancia"'))}
      ${campo('Nivel', sel('nivel',[{v:'bloquea',t:'No se puede realizar'},{v:'precaucion',t:'Realizar con precaución'}], r.nivel))}
      <div class="eyebrow mb6">Servicios afectados (por etiqueta)</div>
      <div class="chkgrid">${TAGS.map(t=>chk('t_'+t[0], t[1], r.tags.indexOf(t[0])>=0)).join('')}</div>`,
    acciones:[
      nueva ? {txt:'Cancelar', fn:cerrarModal}
            : {txt:'Eliminar', cls:'btn--d', ic:'tacho', fn:()=>{ cerrarModal();
                confirmar('Eliminar regla','Se deja de avisar por «'+esc(r.label)+'». ¿Confirmás?',()=>{
                  CONFIG.reglasContra.splice(i,1); toast('Regla eliminada','warn'); render(); },'Eliminar','btn--d'); }},
      {txt:'Guardar', cls:'btn--p', ic:'check', fn:()=>{
        const v = leer($('#mBody')), tags = [];
        TAGS.forEach(t=>{ if(v['t_'+t[0]]) tags.push(t[0]); });
        if(!tags.length) return toast('Elegí al menos un tipo de servicio','warn');
        const label = (v.label||'').trim() || (CONDICIONES.find(c=>c.v===v.cond)||{}).t || v.cond;
        if(nueva) CONFIG.reglasContra.push({cond:v.cond, label, tags, nivel:v.nivel});
        else Object.assign(r, {cond:v.cond, label, tags, nivel:v.nivel});
        cerrarModal(); toast('Regla guardada','ok'); render();
      }}] });
}

/* Alta, edición y baja de una necesidad y sus servicios sugeridos */
function modalSugerencia(nec){
  const nueva = !nec;
  const act = nueva ? [] : (CONFIG.reglasSugerencia[nec]||[]);
  modal({ titulo: nueva ? 'Nueva necesidad' : 'Sugerencias — '+nec, ancho:'ancho',
    cuerpo:`${campo('Necesidad de la paciente', inT('nombre', nec||'', 'placeholder="Ej. Papada / contorno facial"'))}
      <p class="fs12 muted mb10">Elegí qué servicios proponer cuando una paciente declare esta necesidad.
      Los que estén contraindicados por su historia clínica se marcan solos en terracota.</p>
      <div class="chkgrid">${STORE.list('servicios').map(s=>chk('s_'+s.id, svcN(s.id), act.indexOf(s.id)>=0)).join('')}</div>`,
    acciones:[
      nueva ? {txt:'Cancelar', fn:cerrarModal}
            : {txt:'Eliminar', cls:'btn--d', ic:'tacho', fn:()=>{ cerrarModal();
                confirmar('Eliminar necesidad','Se quita «'+esc(nec)+'» de la lista y de las fichas que la tengan. ¿Confirmás?',()=>{
                  delete CONFIG.reglasSugerencia[nec];
                  CONFIG.necesidades = CONFIG.necesidades.filter(x=>x!==nec);
                  STORE.list('pacientes').forEach(p=>{ if((p.necesidades||[]).some(n=>n.nombre===nec))
                    STORE.editar('pacientes', p.id, {necesidades:p.necesidades.filter(n=>n.nombre!==nec)}); });
                  toast('Necesidad eliminada','warn'); render(); },'Eliminar','btn--d'); }},
      {txt:'Guardar', cls:'btn--p', ic:'check', fn:()=>{
        const v = leer($('#mBody')), out = [];
        const nombre = (v.nombre||'').trim();
        if(!nombre) return toast('Poné un nombre para la necesidad','warn');
        STORE.list('servicios').forEach(s=>{ if(v['s_'+s.id]) out.push(s.id); });
        if(!nueva && nombre!==nec){                       // la renombraron
          delete CONFIG.reglasSugerencia[nec];
          CONFIG.necesidades = CONFIG.necesidades.map(x=>x===nec?nombre:x);
          STORE.list('pacientes').forEach(p=>{ (p.necesidades||[]).forEach(n=>{ if(n.nombre===nec) n.nombre=nombre; }); });
        }
        if(CONFIG.necesidades.indexOf(nombre)<0) CONFIG.necesidades.push(nombre);
        CONFIG.reglasSugerencia[nombre] = out;
        cerrarModal(); toast('Sugerencias guardadas','ok'); render();
      }}] });
}
